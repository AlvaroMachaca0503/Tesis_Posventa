const KEY='rmotriz-modulos-r7-1-v1', $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=x=>x==null?'Sin dato':new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(x), uid=()=>crypto.randomUUID(), today=()=>new Date().toLocaleDateString('en-CA'), states=['Recepción','En proceso','Entrega','Archivada'];

function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4000)}
function save(action,detail){db.audit.unshift({date:new Date().toISOString(),action,detail,actor:'Álvaro · demostración'});try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('No se pudo guardar: exporta un respaldo JSON.')}render()}
function go(p){page=p;query='';render()}
const button=(text,js,primary=false)=>`<button type="button" class="${primary?'primary':''}" onclick="${js}">${text}</button>`;
function heading(t,sub,actions=''){return `<div class="heading"><div><h1>${t}</h1><div class="muted">${sub}</div></div><div class="row">${actions}</div></div>`}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="empty">Sin registros. Puedes agregar uno para demostrar el flujo.</td></tr>`}</tbody></table></div>`}
function modal(html){$('modalbody').innerHTML=html;$('modal').showModal()}
function closeModal(){$('modal').close()}
function form(title,fields,fn){modal(`<h2>${title}</h2><form id="editor"><div class="formgrid">${fields}</div><footer>${button('Cancelar','closeModal()')}<button class="primary" type="submit">Guardar</button></footer></form>`);$('editor').onsubmit=e=>{e.preventDefault();try{if(fn(Object.fromEntries(new FormData(e.target)))!==false)closeModal()}catch(err){toast(err.message)}}}
function field(name,label,value='',type='text',attrs=''){if(type==='textarea')return `<label>${label}<textarea name="${name}" ${attrs}>${esc(value)}</textarea></label>`;if(type==='file')return `<label>${label}<input name="${name}" type="file" ${attrs}></label>`;return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${attrs}></label>`}
function select(name,label,items,value){return `<label>${label}<select name="${name}">${items.map(([v,t])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
const techOpts=()=>db.users.filter(u=>['Técnico','Jefe de taller'].includes(u.role)&&u.active).map(u=>[u.id,u.name]);const vehicle=id=>db.vehicles.find(v=>v.id===id)||{};const client=id=>db.clients.find(c=>c.id===id)||{};const tech=id=>db.users.find(u=>u.id===id)?.name||'Sin asignar';const total=o=>r72OrderTotal(o);const paid=o=>db.payments.filter(p=>p.order===o.id).reduce((s,p)=>s+p.amount,0);
function render(){const item=modules.find(m=>m[0]===page);$('crumb').textContent=item?.[2]||page;$('nav').innerHTML=modules.map(m=>m.length===1?`<div class="navtitle">${m[0]}</div>`:`<button class="${page===m[0]?'active':''}" onclick="go('${m[0]}')"><b>${m[1]}</b>${m[2]}</button>`).join('');$('view').innerHTML=views[page]();}
const views={};
views.inicio=()=>heading('Un taller conectado','Clientes, mantenimiento y seguimiento en un solo lugar.',button('+ Nueva orden',"newOrder()",true))+`<div class="grid">${[['Órdenes abiertas',db.orders.filter(o=>o.state!=='Archivada').length,'Operación local'],['Tareas pendientes',db.tasks.filter(t=>t.state!=='Completada').length,'Seguimiento de posventa'],['Citas programadas',db.appointments.filter(a=>!a.order).length,'Agenda del taller'],['Planes disponibles',db.plans.length,'Pendientes de validar']].map(([a,b,c])=>`<div class="panel metric"><span class="muted">${a}</span><strong>${b}</strong><small>${c}</small></div>`).join('')}</div><div class="two space"><section class="panel"><div class="row spread"><h2>Prioridades de posventa</h2>${button('Ver tareas',"go('tareas')")}</div>${db.tasks.slice(0,4).map(t=>`<div class="ticket" onclick="editTask('${t.id}')"><span class="pill">${esc(t.state)}</span><h3>${esc(t.title)}</h3><div class="row spread"><span class="sub">${esc(t.due)}</span><span class="sub">${esc(tech(t.owner))}</span></div></div>`).join('')}</section><section class="panel"><h2>Recorrido de demostración</h2><div class="timeline">${[['1','Crear una ODS','Cliente → vehículo → servicios'],['2','Planificar trabajo','Cita y bloques vinculados'],['3','Cerrar y dar seguimiento','Tarea a cinco días laborables'],['4','Medir el retorno','Contacto → cita → atención']].map(([n,t,s])=>`<div class="event"><b>${t}</b><div class="sub">${s}</div></div>`).join('')}</div><span class="pill orange">Datos históricos conservados; importes desconocidos no inventados</span></section></div>`;
views.clientes=()=>heading('Clientes','Identidad independiente del DNI o teléfono.',button('+ Cliente','editClient()',true))+`<div class="panel">${table(['Cliente','Documento','Contacto','Acción'],db.clients.map(c=>[esc(c.name),esc(c.doc)||'Sin dato',esc(c.phone)||'Sin teléfono',button('Editar',`editClient('${c.id}')`)]))}</div>`;
function editClient(id){const c=client(id);form(id?'Editar cliente':'Nuevo cliente',field('name','Nombre',c.name,'text','required')+field('doc','Documento',c.doc)+field('phone','Teléfono',c.phone)+field('email','Correo',c.email,'email'),d=>{if(id)Object.assign(c,d);else db.clients.push({id:uid(),...d});save('Cliente guardado',d.name)})}

function editVehicle(id){const v=vehicle(id);form('Vehículo',select('client','Cliente',db.clients.map(c=>[c.id,c.name]),v.client)+field('plate','Placa',v.plate,'text','required')+field('brand','Marca',v.brand)+field('model','Modelo',v.model)+field('year','Año',v.year,'number')+field('km','Kilometraje',v.km,'number','min="0"')+field('vin','VIN',v.vin)+field('serial','Serie',v.serial)+field('engine','Código de motor',v.engine)+select('use','Uso',[['P','Particular'],['S','Severo']],v.use),d=>{d.km=+d.km;if(id)Object.assign(v,d);else db.vehicles.push({id:uid(),...d});save('Vehículo guardado',d.plate)})}
views.ods=()=>heading('Órdenes de servicio','Flujo operativo y archivo histórico · sin árbol de servicios ni paquetes.',button('+ Nueva orden','newOrder()',true))+`<div class="tabs">${states.map(s=>button(`${s} · ${db.orders.filter(o=>o.state===s).length}`,`odsState='${s}';render()`)).join('')}</div><div class="row space"><input aria-label="Buscar órdenes" placeholder="Buscar ODS, placa o servicio" value="${esc(query)}" oninput="query=this.value;document.getElementById('ordercards').innerHTML=orderCards()"><span class="pill">${odsState}</span></div><div class="grid space" id="ordercards">${orderCards()}</div>`;

views.reportes=()=>{const done=db.tasks.filter(t=>t.state==='Completada').length,returns=db.appointments.filter(a=>a.order&&db.orders.find(o=>o.id===a.order)?.state==='Archivada').length;return heading('Reportes y metas','Indicadores del prototipo, no resultados de la tesis.',button('Editar metas','editGoals()')+button('Exportar respaldo','downloadData()'))+`<div class="grid">${[['Tareas completadas',done,db.goals.tasks],['Citas creadas',db.appointments.length,db.goals.appointments],['Retornos con ODS cerrada',returns,db.goals.returns]].map(([name,n,goal])=>`<div class="panel metric"><span>${name}</span><strong>${n} <small>/ ${goal}</small></strong><div class="progress"><span style="width:${Math.min(100,n/Math.max(1,goal)*100)}%"></span></div><p class="sub">Meta mensual demostrativa</p></div>`).join('')}</div><div class="panel space"><h2>Producción de servicios por técnico</h2>${table(['Técnico','Servicios cerrados con precio','Venta de servicios','Horas estimadas','Comisión ilustrativa '+db.settings.commission+'%'],techOpts().map(([id,name])=>{const lines=db.orders.filter(o=>o.state==='Archivada').flatMap(o=>o.lines).filter(l=>l.type==='servicio'&&l.tech===id&&l.price!=null);const revenue=lines.reduce((s,l)=>s+l.qty*l.price,0);return [esc(name),lines.length,money(revenue),lines.reduce((s,l)=>s+(l.hours||0),0)+' h',money(revenue*db.settings.commission/100)]}))}<p class="sub">Solo datos locales con importe conocido. Sin impuestos, nómina ni rentabilidad neta. Horas estimadas no equivalen a tiempo trabajado.</p></div>`};

let odsFrom='',odsTo='',reportKind='Operaciones',reportFrom='',reportTo='',reportBasis='Ingreso',reportTech='';
function quantityHH(l){return l.type==='servicio'?(l.hours??null):l.qty}
function lineAmount(l){return l.price==null?null:Math.round(l.qty*l.price*100)/100}
function orderTotal(o){return o.lines.some(l=>lineAmount(l)==null)?null:o.lines.reduce((s,l)=>s+lineAmount(l),0)}
function matchingOrders(){return db.orders.filter(o=>o.state===odsState&&(!odsFrom||o.date>=odsFrom)&&(!odsTo||o.date<=odsTo)&&`${o.code} ${vehicle(o.vehicle).plate} ${client(vehicle(o.vehicle).client).name} ${o.lines.map(l=>l.name)}`.toLowerCase().includes(query.toLowerCase()))}

openOrder=function(id,customer=false){const o=db.orders.find(o=>o.id===id);modal(`<div class="row spread"><h2>ODS #${esc(o.code)} · ${esc(o.state)}</h2><b>${esc(vehicle(o.vehicle).plate)}</b></div><p>${esc(client(vehicle(o.vehicle).client).name)} · Ingreso ${esc(o.date)} · Salida ${esc(o.closed)||'Sin registrar'}</p>${table(customer?['Ítem','Cant. / H-H','Precio unitario / H-H','Importe']:['Ítem','Técnico','Cant. / H-H','Tiempo revisado','Costo unitario','Venta unitaria / H-H','Importe',''],o.lines.map(l=>{const q=quantityHH(l),qty=(q==null?'Sin dato':q)+`<small>${l.type==='servicio'?'H-H presupuestadas':'Unidades'}</small>`;return customer?[esc(l.name),qty,money(l.price),money(lineAmount(l))]:[esc(l.name)+`<small>${esc(l.type)}</small>`,esc(tech(l.tech)),qty,l.type==='servicio'?(l.revised??l.hours??'Sin dato')+' h':'—',money(l.cost),money(l.price),money(lineAmount(l)),o.state==='Archivada'?'Bloqueado':button('Editar',`closeModal();editLine('${id}','${l.id}')`)]}))}<h2 class="space">Total: ${money(orderTotal(o))}</h2><p class="sub">Cant. / H-H = unidades de productos u horas presupuestadas de servicios. Ampliar tiempo operativo no cambia cantidad comercial ni precio. Los datos históricos desconocidos no se estiman.</p><footer>${button('Cerrar','closeModal()')}${button('Imprimir / PDF','window.print()')}${!customer?button('Vista cliente',`closeModal();openOrder('${id}',true)`):''}${o.state!=='Archivada'&&!customer?button('+ Ítem',`closeModal();editLine('${id}')`)+button('Avanzar proceso',`advanceOrder('${id}')`,true):''}${o.state==='Archivada'&&!customer?button('Reabrir con motivo',`closeModal();reopen('${id}')`):''}</footer>`)};
editLine=function(orderId,lineId){const o=db.orders.find(x=>x.id===orderId),l=o.lines.find(x=>x.id===lineId)||{};if(o.state==='Archivada')return toast('Reabre la ODS antes de editar.');if(db.notes.some(n=>n.order===orderId))return toast('Nota emitida: falta implementar el ajuste documental para cambiar importes.');form('Ítem · cantidad o H-H',field('name','Descripción',l.name,'text','required')+select('type','Tipo',[['servicio','Servicio / mano de obra'],['producto','Producto por ODS']],l.type)+select('tech','Técnico del servicio',techOpts(),l.tech||o.tech)+field('quantity','Cant. / H-H',quantityHH(l)??1,'number','min="0.01" step="0.01" required')+field('cost','Costo por unidad / H-H',l.cost??0,'number','min="0" step="0.01" required')+field('price','Precio por unidad / H-H',l.price??0,'number','min="0" step="0.01" required')+`<p class="wide sub">Servicio: 3 = 3 H-H, pasos de 0.5. Producto: 3 = 3 unidades. Importe = cantidad × precio por unidad/H-H.</p>`,d=>{const q=+d.quantity;if(d.type==='servicio'&&(q<0.25||Math.round(q*4)!==q*4)){toast('Las H-H deben avanzar en pasos de 0.25.');return false}const before=JSON.stringify(l),changes={name:d.name,type:d.type,tech:d.type==='servicio'?d.tech:null,qty:q,hours:d.type==='servicio'?q:null,price:+d.price,cost:+d.cost};if(lineId)Object.assign(l,changes);else o.lines.push({id:uid(),...changes});save('Detalle actualizado',o.code+' · antes '+before+' · después '+JSON.stringify(changes))})};

function blockEnd(b){return workSegments(b.start,b.hours).at(-1)?.[1]??b.start}
function validSlot(techId,date,start,hours,ignore){const seg=workSegments(start,hours);if(!techId||!date||!seg.length||start<480||start%30!==0||blockEnd({start,hours})>1200)return false;const points=seg.flatMap(([a,b])=>[[a,1],[b,-1]]);for(const b of db.blocks.filter(b=>b.tech===techId&&b.date===date&&b.id!==ignore))points.push(...workSegments(b.start,b.hours).flatMap(([a,z])=>[[a,1],[z,-1]]));points.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let n=0;return points.every(p=>(n+=p[1])<=2)}

function agendaColumn(id){let ends=[0,0];const blocks=db.blocks.filter(b=>b.tech===id&&b.date===selectedDate).sort((a,b)=>a.start-b.start);const html=blocks.map(b=>{let lane=ends.findIndex(e=>e<=b.start);if(lane<0)lane=0;ends[lane]=blockEnd(b);const v=blockVehicle(b);return `<div class="work-block" data-block="${b.id}" style="top:${(b.start-480)*1.2}px;height:${Math.max(36,(blockEnd(b)-b.start)*1.2)}px;left:calc(${lane*50}% + 3px);width:calc(50% - 6px)"><div class="resize top" data-mode="start" aria-label="Cambiar inicio">═</div><div class="block-content" data-mode="move"><b>${esc(v.plate||'Sin placa')} · ${esc(v.model||'')}</b><small>${esc(b.name)}</small><small>${timeText(b.start)}–${timeText(blockEnd(b))} · ${b.hours} H-H</small><span>${b.appointment?'Con cita previa':'Sin cita previa'}</span></div><div class="resize bottom" data-mode="end" aria-label="Cambiar fin">═</div></div>`}).join('');return `<div class="tech-column" data-tech="${id}" onclick="slotClick(event,'${id}')"><div class="lunch-band" style="top:${(db.settings.lunchStart*60-480)*1.2}px;height:${(db.settings.lunchEnd-db.settings.lunchStart)*72}px">Almuerzo</div>${html}</div>`}
function slotClick(e,id){if(e.target.closest('.work-block')||dragJustEnded)return;let start=480+Math.floor((e.clientY-e.currentTarget.getBoundingClientRect().top)/36)*30;if(start>=db.settings.lunchStart*60&&start<db.settings.lunchEnd*60)start=db.settings.lunchEnd*60;if(!canManage()&&actor!==id)return toast('Solo tu propia jornada.');modal(`<h2>${timeText(start)} · ${esc(tech(id))}</h2><p>Selecciona el origen del trabajo.</p><footer>${button('Nueva cita',`closeModal();newAppointment(null,{tech:'${id}',start:${start},date:'${selectedDate}'})`)}${button('Servicio de ODS existente',`closeModal();addScheduledWork('${id}',${start})`)}${button('Cancelar','closeModal()')}</footer>`)}

document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-block]');if(!el)return;const b=db.blocks.find(b=>b.id===el.dataset.block);if(!b)return;const past=b.date<today();if((past&&actorUser()?.role!=='Jefe de taller')||(b.appointment&&!canManage())||(!canManage()&&b.tech!==actor)){toast('Este bloque requiere cajera/jefe; días anteriores solo jefe.');return}drag={id:b.id,y:e.clientY,start:b.start,hours:b.hours,end:blockEnd(b),mode:e.target.closest('[data-mode]')?.dataset.mode||'move',el,moved:false};el.setPointerCapture(e.pointerId);e.preventDefault()});

function proposeBlockChange(id,start,hours){const b=db.blocks.find(b=>b.id===id);if(!validSlot(b.tech,b.date,start,hours,id))return toast('Cambio rechazado: límite 08–20, pasos de 30 minutos o tercera superposición.');form('Confirmar cambio de horario',`<div class="wide">Antes: ${timeText(b.start)}–${timeText(blockEnd(b))}, ${b.hours} h. Después: ${timeText(start)}–${timeText(blockEnd({start,hours}))}, ${hours} h. Precio sin cambios.</div>`+field('reason','Motivo','','text','required'),d=>{commitBlockChange(id,start,hours,d.reason)})}
function commitBlockChange(id,start,hours,reason){const b=db.blocks.find(b=>b.id===id);if(!reason||!validSlot(b.tech,b.date,start,hours,id))throw Error('Horario no válido');if(b.date<today()&&actorUser()?.role!=='Jefe de taller')throw Error('Solo jefe corrige días anteriores');if(b.appointment&&!canManage())throw Error('Solo cajera/jefe mueve reservas');if(!canManage()&&b.tech!==actor)throw Error('Bloque de otro técnico');const before={start:b.start,hours:b.hours};Object.assign(b,{start,hours,note:reason});const o=db.orders.find(o=>o.id===b.order),l=o?.lines.find(l=>l.id===b.service);if(l)l.revised=Math.max(0,(l.revised??l.hours??0)+hours-before.hours);if(b.appointment){const a=db.appointments.find(a=>a.id===b.appointment);const first=db.blocks.filter(x=>x.appointment===a.id).sort((x,y)=>x.date.localeCompare(y.date)||x.start-y.start)[0];a.date=first.date;a.time=timeText(first.start);a.state='Por reconfirmar';db.tasks.push({id:uid(),list:'postventa',title:'Reconfirmar cita '+vehicle(a.vehicle).plate,owner:'u-caja',due:a.date,state:'Pendiente',notes:[reason]})}db.dayReviews=db.dayReviews.filter(r=>r.date!==b.date);save('Horario corregido',JSON.stringify({id,order:b.order,before,after:{start,hours},reason}))}

let timelineVehicle=db.vehicles[0]?.id,simKm=null;
const normal=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function binKm(k){return Math.floor(k/5000)*5000}
function historyFor(v){return db.orders.filter(o=>o.vehicle===v.id&&o.state==='Archivada'&&o.approval!=='No aprobada').sort((a,b)=>a.date.localeCompare(b.date))}

const start=Math.min(250000,...valid.map(o=>binKm(o.km))),end=Math.max(400000,Math.ceil((v.km||0)/5000)*5000),bins=Array.from({length:Math.floor((end-start)/5000)+1},(_,i)=>start+i*5000),plan=db.plans.find(p=>p.id===v.plan);return {v,hist,last,rate,estimate,bins,plan,cfg}}
function oilInterval(type){return type==='Mineral'||type==='Semisintético'?5000:type==='Sintético'||type==='Full sintético'?7500:null}
function ruleMatches(r,l){if(l.type!=='servicio')return false;const a=normal(r.n),b=normal(l.name);if(a.includes('aceite')&&a.includes('motor'))return b==='cambio de aceite de motor';return a===b}
function timelineRule(r,m){const rr=r[m.v.use||'S']||{},oil=normal(r.n).includes('aceite')&&normal(r.n).includes('motor'),k=oil?oilInterval(m.v.oil):rr.k,months=rr.m;const evidence=m.hist.filter(o=>o.km!=null&&o.lines.some(l=>ruleMatches(r,l))),base=evidence.at(-1);let events=[];
if(base&&k){for(let n=1;n<=80&&base.km+n*k<=m.bins.at(-1)+5000;n++){let due=new Date(base.date+'T12:00:00');if(months)due.setMonth(due.getMonth()+n*months);let km=base.km+n*k,date=months?due.toLocaleDateString('en-CA'):null,projectedDate=m.rate>0?new Date(new Date(base.date+'T12:00:00').getTime()+n*k/m.rate*30.4375*86400000).toLocaleDateString('en-CA'):null;const expired=(simKm??m.estimate)>=km||(date&&date<today());events.push({km,date:date||projectedDate,expired,n,base,conditional:true})}}

function timelineCell(r,m,k){const model=timelineRule(r,m),real=model.evidence.filter(o=>binKm(o.km)===k),future=model.events.filter(e=>binKm(e.km)===k);return real.map(o=>`<button class="tlmark real" onclick="openOrder('${o.id}')">✓ ${esc(o.date)}<small>ODS ${esc(o.code)}</small></button>`).join('')+future.map(e=>`<button class="tlmark ${e.expired?'overdue':'forecast'}" onclick="timelineEvidence(${m.plan.rules.indexOf(r)},${e.n})">${e.expired?'! Vencido':'◇ Programado'}<small>${e.km.toLocaleString('es-PE')} km${e.date?' · '+e.date:''}</small></button>`).join('')+(!model.base&&k===binKm(m.last?.km||m.v.km)?'<span class="tlmark unknown">? Sin registrar<br>↻ Revisar próxima visita</span>':'')}

views.timeline=()=>{const m=timelineModel(),v=m.v,current=simKm??m.estimate;return heading('Línea temporal','Historial, meses y kilometraje en una sola matriz',button('Imprimir / PDF','window.print()'))+`<div class="filterbar"><label>Vehículo<select onchange="timelineVehicle=this.value;simKm=null;render()">${db.vehicles.map(v=>`<option value="${v.id}" ${v.id===timelineVehicle?'selected':''}>${esc(v.plate+' · '+v.model)}</option>`).join('')}</select></label><label>Uso<select onchange="vehicle(timelineVehicle).use=this.value;save('Uso simulado',timelineVehicle)"><option value="S" ${v.use==='S'?'selected':''}>Severo</option><option value="P" ${v.use==='P'?'selected':''}>Particular</option></select></label><label>Aceite<select onchange="vehicle(timelineVehicle).oil=this.value;save('Aceite elegido',timelineVehicle)">${['','Mineral','Semisintético','Sintético','Full sintético'].map(s=>`<option ${s===(v.oil||'')?'selected':''} value="${s}">${s||'Sin seleccionar'}</option>`).join('')}</select></label><label>Estimación km/mes<input type="number" min="0" max="15000" value="${m.rate}" onchange="setKmRate(this.value)"></label></div>
<div class="grid space"><div class="panel"><small>Último ingreso con km</small><h2>${m.last?.km?.toLocaleString('es-PE')||'Sin lectura'} km</h2><p>${esc(m.last?.date)} · ODS ${esc(m.last?.code)}</p></div><div class="panel"><small>Hoy estimado, no lectura real</small><h2>${m.estimate?.toLocaleString('es-PE')} km</h2><p>Tasa editable de simulación · ${today()}</p></div><div class="panel"><small>Simulación</small><h2>${Math.round(current).toLocaleString('es-PE')} km</h2><input aria-label="Simular kilometraje" type="range" min="${m.bins[0]}" max="${m.bins.at(-1)}" step="500" value="${current}" onchange="simKm=+this.value;render()">${button('Restablecer','simKm=null;render()')}</div><div class="panel"><small>Plan explícito del vehículo</small><h2>${esc(m.plan?.id||'Sin plan')}</h2><p>Reglas no aprobadas técnicamente.</p></div></div>
<p class="banner">Aceite: mineral/semisintético 5.000 km; sintético/full sintético 7.500 km, propuesta del usuario pendiente de validación. Los demás intervalos conservan su regla. No se convierten reparaciones ni productos en evidencia de cambio de aceite.</p><p>✓ Registrado · ! Vencido (solo el primer pendiente; km o tiempo, lo que ocurra primero) · ◇ Programado · ○ Condicional (presupone atender el anterior) · ? Sin registro · — Sin intervalo documentado</p>${timelineMatrix(m,current)}`};
function setKmRate(value){const rate=+value;if(!Number.isFinite(rate)||rate<0||rate>15000)return toast('Tasa entre 0 y 15.000');db.timelineSettings[timelineVehicle]={rate};simKm=null;save('Tasa de simulación',timelineVehicle+' '+rate)}
function timelineMatrix(m,current){if(!m.plan)return '<div class="panel">Vehículo sin plan explícito: no se genera proyección.</div>';const cls=k=>[k===binKm(m.last?.km)?'lastcol':'',k===binKm(current)?'simcol':''].join(' '),monthLabel=k=>{const known=m.hist.find(o=>o.km!=null&&binKm(o.km)===k);if(known)return known.date.slice(0,7)+' · registro';if(!m.last||!m.rate)return 'Mes sin estimar';return new Date(new Date(m.last.date+'T12:00:00').getTime()+(k-m.last.km)/m.rate*30.4375*86400000).toLocaleDateString('es-PE',{month:'short',year:'numeric'})+' · est.'};
return `<div class="tl-scroll"><table class="tlmatrix"><thead><tr><th class="tlservice">Actividad / categoría</th>${m.bins.map(k=>`<th class="${cls(k)}">${k.toLocaleString('es-PE')} km<small>${monthLabel(k)}</small>${k===binKm(m.last?.km)?'<small>Último registro</small>':''}${k===binKm(current)?'<small>Simulación actual</small>':''}</th>`).join('')}<th>Sin kilometraje</th></tr></thead><tbody>${m.plan.rules.map(r=>`<tr><td class="tlservice"><b>${esc(r.n)}</b><small>${esc(r.category||r.cat||'Mantenimiento preventivo')}</small><small>${tlRuleLabel(r,m)}</small></td>${m.bins.map(k=>`<td class="${cls(k)}">${timelineCell(r,m,k)}</td>`).join('')}<td>${m.hist.filter(o=>o.km==null&&o.lines.some(l=>ruleMatches(r,l))).map(o=>button('✓ '+esc(o.date),`openOrder('${o.id}')`)).join('')}</td></tr>`).join('')}<tr class="ods-band"><td class="tlservice"><b>ODS reales</b><small>Mismas columnas; fechas originales.</small></td>${m.bins.map(k=>`<td class="${cls(k)}">${m.hist.filter(o=>o.km!=null&&binKm(o.km)===k).map(o=>`<button class="ods-chip" onclick="openOrder('${o.id}')"><b>#${esc(o.code)}</b><small>${o.date}<br>${o.km.toLocaleString('es-PE')} km</small></button>`).join('')}</td>`).join('')}<td>${m.hist.filter(o=>o.km==null).map(o=>button('#'+esc(o.code)+' · '+o.date,`openOrder('${o.id}')`)).join('')}</td></tr></tbody></table></div><p class="sub">Cada columna incluye desde su km hasta el siguiente (límite superior excluido). Mes estimado ≠ fecha real. Los eventos conservan su umbral exacto. Sin km se conserva la fecha por separado.</p>`}

  if(byKm||byTime){push(km1,d1||est(base.km,base.date,km1),d1?'umbral':'est.','vencido',n++,byKm&&byTime?'km y tiempo':byKm?'km':'tiempo');fromKm=cur;fromDate=now}

function r6ViewBar(){return `<div class="r6-viewbar">${r6SavedViews().map(v=>`<button onclick="r6ApplyView('${v.id}')">▦ ${esc(v.name)}</button>`).join('')}<button onclick="r6SaveView()">＋ Guardar vista</button></div>`}
function r6SaveView(){form('Guardar vista personal',field('name','Nombre de la vista',(actorUser()?.name||'Usuario').split(' ')[0]+' General','text','required'),d=>{db.savedTaskViews.push({id:uid(),user:actor,name:d.name,taskView,list:listFilter,group:r6GroupBy,filters:structuredClone(r6Filters)});save('Vista personal guardada',d.name)})}
function r6ApplyView(id){const v=db.savedTaskViews.find(v=>v.id===id);if(!v)return;taskView=v.taskView;listFilter=v.list;r6GroupBy=v.group;r6Filters=structuredClone(v.filters||[]);render()}
function r6Toolbar(){return `${r6ViewBar()}<div class="r6-toolbar">${button(`☰ ${r6Filters.length} filtros`,'r6FilterOpen=!r6FilterOpen;render()')}<label>Agrupar por<select onchange="r6GroupBy=this.value;render()"><option value="">Sin agrupar</option>${[['state','Estado'],['list','Lista'],['priority','Prioridad'],['owner','Persona asignada'],['type','Tipo']].map(([v,n])=>`<option value="${v}" ${r6GroupBy===v?'selected':''}>${n}</option>`).join('')}</select></label><span class="spacer"></span>${button('+ Tarea',"r6NewTask(null,'Tarea')",true)}</div>${r6FilterPanel()}`}
function r6BulkBar(){return r6Selected.size?`<div class="r6-bulk"><b>${r6Selected.size} seleccionadas</b>${button('Reasignar','r6BulkAssign()')}${button('Cambiar estado','r6BulkState()')}${button('Eliminar','r6BulkDelete()')} ${button('Cancelar selección','r6Selected.clear();render()')}</div>`:''}
function r6ToggleSelect(id,checked){checked?r6Selected.add(id):r6Selected.delete(id);render()}
function r6ToggleAll(checked){filteredTasks().forEach(t=>checked?r6Selected.add(t.id):r6Selected.delete(t.id));render()}
function r6BulkAssign(){form('Reasignar tareas',select('owner','Nueva persona',db.users.filter(u=>u.active).map(u=>[u.id,u.name])),d=>{db.tasks.filter(t=>r6Selected.has(t.id)).forEach(t=>t.owner=d.owner);r6Selected.clear();save('Reasignación masiva',d.owner)})}
function r6BulkState(){form('Cambiar estado masivo',select('state','Estado',r6States().map(x=>[x,x])),d=>{db.tasks.filter(t=>r6Selected.has(t.id)).forEach(t=>{t.state=d.state;if(d.state==='Completada')createNextRecurring(t)});r6Selected.clear();save('Estado masivo',d.state)})}
function r6BulkDelete(){if(!confirm('Las tareas seleccionadas quedarán inactivas y podrán conservarse en auditoría.'))return;db.tasks.filter(t=>r6Selected.has(t.id)).forEach(t=>t.deleted=true);r6Selected.clear();save('Baja masiva de tareas','Baja recuperable')}

function r6Inline(id,field,value){const t=db.tasks.find(t=>t.id===id);if(!t)return;t[field]=value;if(field==='end')t.due=value;if(field==='state'&&value==='Completada')createNextRecurring(t);save('Edición en tabla',id+' '+field)}
function r6GridHeader(){return `<div class="r6-gridrow r6-gridhead"><div><input type="checkbox" onchange="r6ToggleAll(this.checked)"></div><div>Estado</div><div>Tarea</div><div>Inicio</div><div>Límite</div><div>Asignada</div><div>Prioridad</div><div>Creada por</div><div>Lista</div><div>Comentarios</div></div>`}
function r6GridRow(t,depth=0){const comments=db.taskComments.filter(c=>c.task===t.id).length,creator=t.createdBy==='Sistema'?'Sistema':tech(t.createdBy)||t.createdBy||'Sistema';return `<div class="r6-gridrow"><div><input type="checkbox" ${r6Selected.has(t.id)?'checked':''} onchange="r6ToggleSelect('${t.id}',this.checked)"></div><div>${taskStateButton(t)}</div><div class="r6-titlecell"><span class="r6-indent">${depth?'↳':''}</span><span class="r6-typebadge ${t.type==='Orden de servicio'?'r6-odsbadge':''}">${esc(t.type)}</span><input value="${esc(t.title)}" onchange="r6Inline('${t.id}','title',this.value)" onclick="event.stopPropagation()"><span class="r6-quick"><button title="Añadir subtarea" onclick="event.stopPropagation();r6NewTask('${t.id}','Tarea')">＋</button><button title="Abrir detalle" onclick="event.stopPropagation();openTaskPanel('${t.id}')">↗</button></span></div><div><input type="date" value="${esc(t.start||today())}" onchange="r6Inline('${t.id}','start',this.value)"></div><div><input type="date" value="${esc(t.end||t.due||today())}" onchange="r6Inline('${t.id}','end',this.value)"></div><div><select onchange="r6Inline('${t.id}','owner',this.value)">${db.users.filter(u=>u.active).map(u=>`<option value="${u.id}" ${u.id===t.owner?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div><select onchange="r6Inline('${t.id}','priority',this.value)">${r6Priorities().map(x=>`<option ${x===t.priority?'selected':''}>${x}</option>`).join('')}</select></div><div>${esc(creator)}</div><div><select onchange="r6Inline('${t.id}','list',this.value)">${db.lists.map(l=>`<option value="${l.id}" ${l.id===taskList(t)?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div><button onclick="openTaskPanel('${t.id}','activity')">💬 ${comments}</button></div></div>`}
function r6FlatRows(tasks){const byParent=new Map();tasks.forEach(t=>{const p=t.parent||'';if(!byParent.has(p))byParent.set(p,[]);byParent.get(p).push(t)});const walk=(p,d)=>((byParent.get(p)||[]).flatMap(t=>[r6GridRow(t,d),...walk(t.id,d+1)]));return walk('',0).join('')}
function r6GroupKey(t){if(!r6GroupBy)return '';if(r6GroupBy==='list')return db.lists.find(l=>l.id===taskList(t))?.name||'Sin lista';if(r6GroupBy==='owner')return tech(t.owner)||'Sin asignar';return t[r6GroupBy]||'Sin dato'}
function taskListR6(ts){if(!r6GroupBy)return `<div class="r6-sheet"><div class="r6-grid">${r6GridHeader()}${r6FlatRows(ts)}</div></div>`;const groups=Object.groupBy(ts,r6GroupKey);return `<div class="r6-sheet"><div class="r6-grid">${Object.entries(groups).map(([k,v])=>`<div class="r6-group">${esc(k)} <small>${v.length} tareas</small></div>${r6GridHeader()}${r6FlatRows(v)}`).join('')}</div></div>`}
function taskContentR6(){const ts=filteredTasks();if(taskView==='Lista')return taskListR6(ts);if(taskView==='Tablero')return taskBoardR5(ts);if(taskView==='Calendario')return taskCalendarR5(ts);return agendaGrid()}

function r6NewTask(parent,type='Tarea'){const p=db.tasks.find(t=>t.id===parent),t={id:uid(),title:'Nueva tarea',type,owner:actor,state:'Pendiente',priority:'Normal',list:p?.list||listFilter||db.lists[0]?.id,start:today(),end:today(),due:today(),startTime:'08:00',endTime:'09:00',createdBy:actor,createdAt:new Date().toISOString(),parent:parent||null,description:'',tags:'',deleted:false};db.tasks.push(t);r6PanelId=t.id;r6PanelTab='details';save('Tarea creada',t.id)}

function r6TaskFlow(t){return `<div class="r6-flow"><b>Tarea</b><span>→</span><b>Cita</b><span>→</span><b>Orden de servicio</b>${t.appointmentId?'<span class="pill green">Cita creada</span>':''}${t.orderId?'<span class="pill green">ODS creada</span>':''}</div>`}
function r6CommentHtml(c){const author=tech(c.actor)||c.actor,att=c.attachment?c.attachment.type.startsWith('image/')?`<img src="${c.attachment.data}" alt="${esc(c.attachment.name)}">`:`<audio controls src="${c.attachment.data}"></audio>`:'';return `<article class="r6-comment ${c.replyTo?'reply':''}"><header><b>${esc(author)}</b><small>${esc(c.date)}</small></header>${c.replyTo?`<small>Respuesta a ${esc(db.taskComments.find(x=>x.id===c.replyTo)?.text||'comentario')}</small>`:''}<p>${esc(c.text)}</p>${att}<footer><button onclick="r6React('${c.id}','👍')">👍 ${(c.reactions?.['👍']||[]).length}</button><button onclick="r6React('${c.id}','😊')">😊 ${(c.reactions?.['😊']||[]).length}</button><button onclick="r6ReplyTo='${c.id}';render()">Responder</button></footer></article>`}
function r6Comments(t){const rows=db.taskComments.filter(c=>c.task===t.id);return `<div class="r6-comments">${rows.map(r6CommentHtml).join('')||'<p class="sub">Todavía no hay comentarios.</p>'}</div>${r6ReplyTo?`<div class="r6-replying">Respondiendo a: ${esc(db.taskComments.find(c=>c.id===r6ReplyTo)?.text||'')} <button onclick="r6ReplyTo=null;render()">×</button></div>`:''}<form class="r6-compose" onsubmit="event.preventDefault();r6PostComment('${t.id}',this)"><textarea name="message" required placeholder="Escribe un comentario. Ctrl + Enter para enviar." onkeydown="if(event.ctrlKey&&event.key==='Enter')this.form.requestSubmit()"></textarea><div class="r6-composebar"><label class="btn">＋ Archivo<input name="attachment" type="file" accept="image/jpeg,image/png,image/webp,audio/*"></label><button type="button" onclick="r6Dictate(this.form.elements.message)">🎙 Voz a texto</button><span class="spacer"></span><button class="primary">Enviar ➤</button></div></form>`}
function r6PostComment(id,formEl){const text=formEl.elements.message.value.trim(),file=formEl.elements.attachment.files[0],add=attachment=>{db.taskComments.push({id:uid(),task:id,actor,text,date:new Date().toISOString(),replyTo:r6ReplyTo,reactions:{},attachment});r6ReplyTo=null;save('Comentario de tarea',id)};if(!file)return add(null);if(file.size>700000||!(/^(image\/(jpeg|png|webp)|audio\/)/.test(file.type)))return toast('Solo imagen o audio de hasta 700 KB.');const reader=new FileReader();reader.onload=()=>add({name:file.name,type:file.type,data:reader.result});reader.readAsDataURL(file)}
function r6React(id,emoji){const c=db.taskComments.find(c=>c.id===id);c.reactions??={};c.reactions[emoji]??=[];const a=c.reactions[emoji],i=a.indexOf(actor);i>=0?a.splice(i,1):a.push(actor);save('Reacción a comentario',id+' '+emoji)}
function r6Dictate(input){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech)return toast('El navegador no ofrece dictado. Usa el micrófono del teclado de la tablet.');const r=new Speech();r.lang='es-PE';r.onresult=e=>{input.value+=(input.value?' ':'')+e.results[0][0].transcript};r.start()}
function r6TaskPanel(){if(!r6PanelId)return '';const t=db.tasks.find(t=>t.id===r6PanelId);if(!t||t.deleted)return '';return `<div class="r6-panelback" onclick="closeTaskPanel()"></div><aside class="r6-taskpanel"><div class="paneltop row spread"><b>${esc(db.lists.find(l=>l.id===taskList(t))?.name||'Tarea')}</b><button onclick="closeTaskPanel()">✕</button></div><input class="titleedit" value="${esc(t.title)}" onchange="r6PanelField('${t.id}','title',this.value)">${r6TaskFlow(t)}<div class="tabs"><button class="${r6PanelTab==='details'?'selected':''}" onclick="r6PanelTab='details';render()">Detalles</button><button class="${r6PanelTab==='activity'?'selected':''}" onclick="r6PanelTab='activity';render()">Actividad / comentarios</button></div>${r6PanelTab==='activity'?r6Comments(t):`<div class="r6-detailgrid"><label>Tipo</label><select onchange="r6PanelField('${t.id}','type',this.value)">${r6TaskTypes().map(x=>`<option ${x===t.type?'selected':''}>${x}</option>`).join('')}</select><label>Estado</label><select onchange="r6PanelField('${t.id}','state',this.value)">${r6States().map(x=>`<option ${x===t.state?'selected':''}>${x}</option>`).join('')}</select><label>Asignado</label><select onchange="r6PanelField('${t.id}','owner',this.value)">${db.users.filter(u=>u.active).map(u=>`<option value="${u.id}" ${u.id===t.owner?'selected':''}>${esc(u.name)}</option>`).join('')}</select><label>Inicio</label><input type="datetime-local" value="${esc((t.start||today())+'T'+(t.startTime||'08:00'))}" onchange="const [d,h]=this.value.split('T');r6Inline('${t.id}','start',d);r6Inline('${t.id}','startTime',h)"><label>Fecha límite</label><input type="datetime-local" value="${esc((t.end||today())+'T'+(t.endTime||'18:00'))}" onchange="const [d,h]=this.value.split('T');r6Inline('${t.id}','end',d);r6Inline('${t.id}','endTime',h)"><label>Prioridad</label><select onchange="r6PanelField('${t.id}','priority',this.value)">${r6Priorities().map(x=>`<option ${x===t.priority?'selected':''}>${x}</option>`).join('')}</select><label>Etiquetas</label><input value="${esc(t.tags||'')}" onchange="r6PanelField('${t.id}','tags',this.value)"><label>Descripción</label><textarea onchange="r6PanelField('${t.id}','description',this.value)">${esc(t.description||'')}</textarea></div><div class="r6-actions">${button('+ Subtarea',`r6NewTask('${t.id}','Tarea')`)}${button('+ Tarea relacionada',`r6NewRelatedTask('${t.id}')`)}${button('Crear cita',`r6CreateAppointment('${t.id}')`)}${button('Completar + cita',`r6CreateAppointment('${t.id}',{},true)`)}${button('Crear ODS',`r6CreateOrder('${t.id}')`)}${button('Duplicar',`r6DuplicateTask('${t.id}')`)}${t.appointmentId?button('Ver cita',`openAppointmentR5('${t.appointmentId}')`):''}${t.orderId?button('Ver ODS',`openOrder('${t.orderId}')`):''}${button('Completar',`r6Inline('${t.id}','state','Completada')`,true)}${button('Cancelar',`r6Inline('${t.id}','state','Cancelada')`)}</div>`}</aside>`}

let r6TableSeq=0;
const r6BaseTable=table;
table=function(headers,rows){const id='r6table-'+(++r6TableSeq);return `<div class="tablewrap"><table id="${id}"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr><tr class="r6-colfilters">${headers.map((h,i)=>`<th><div class="row"><select aria-label="Operador ${esc(h)}" data-opcol="${i}" onchange="r6FilterTable(this)"><option value="contains">Contiene</option><option value="is">Es</option><option value="notcontains">No contiene</option></select><input data-filtercol="${i}" aria-label="Filtrar ${esc(h)}" placeholder="Filtrar" oninput="r6FilterTable(this)"></div></th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};
function r6FilterTable(el){const t=el.closest('table'),filters=[...t.querySelectorAll('[data-filtercol]')].map(i=>({i:+i.dataset.filtercol,value:i.value.trim().toLowerCase(),op:t.querySelector(`[data-opcol="${i.dataset.filtercol}"]`)?.value||'contains'}));t.querySelectorAll('tbody tr').forEach(row=>{const cells=[...row.cells];row.hidden=!filters.every(f=>{if(!f.value)return true;const v=(cells[f.i]?.innerText||'').trim().toLowerCase();return f.op==='is'?v===f.value:f.op==='notcontains'?!v.includes(f.value):v.includes(f.value)})})}

const R6_ATTENTION=['Mantenimiento preventivo','Mantenimiento correctivo','Preventivo y correctivo','Auxilio mecánico','Evaluación y diagnóstico','Garantía','Siniestro','Inspección 360','Inspección por compra','Otro'];

function r6SyncOrderTask(o,sourceTask){let root=db.tasks.find(t=>t.orderId===o.id&&t.type==='Orden de servicio');if(!root){root={id:uid(),title:'ODS '+o.code+' · '+vehicle(o.vehicle).plate,type:'Orden de servicio',owner:o.tech||actor,state:o.state==='Archivada'?'Completada':'En proceso',priority:'Alta',list:'operativa',start:o.date,end:o.closed?.slice(0,10)||o.date,due:o.closed?.slice(0,10)||o.date,startTime:'08:00',endTime:'18:00',createdBy:actor,createdAt:new Date().toISOString(),orderId:o.id,sourceTask:sourceTask||null,description:o.attentionType||'',tags:'ODS',deleted:false};db.tasks.push(root)}else Object.assign(root,{title:'ODS '+o.code+' · '+vehicle(o.vehicle).plate,owner:o.tech||root.owner,state:o.state==='Archivada'?'Completada':'En proceso',description:o.attentionType||root.description});o.taskId=root.id;if(sourceTask){const s=db.tasks.find(t=>t.id===sourceTask);if(s)s.orderId=o.id}const serviceIds=new Set(o.lines.filter(l=>l.type==='servicio').map(l=>l.id));db.tasks.filter(t=>t.parent===root.id&&t.serviceLineId&&!serviceIds.has(t.serviceLineId)).forEach(t=>t.deleted=true);o.lines.filter(l=>l.type==='servicio').forEach(l=>{let t=db.tasks.find(t=>t.parent===root.id&&t.serviceLineId===l.id);if(!t){t={id:uid(),title:l.name,type:'Tarea',owner:l.tech||o.tech,state:'Pendiente',priority:'Normal',list:'operativa',start:o.date,end:o.date,due:o.date,startTime:'08:00',endTime:'09:00',createdBy:actor,createdAt:new Date().toISOString(),parent:root.id,orderId:o.id,serviceLineId:l.id,description:'Servicio de '+o.code,tags:'Servicio ODS',deleted:false};db.tasks.push(t)}else Object.assign(t,{title:l.name,owner:l.tech||o.tech,deleted:false})});return root}
function r6CreateOrder(taskId,prefill={}){const source=db.tasks.find(t=>t.id===taskId);form('Crear orden de servicio',select('vehicle','Vehículo',db.vehicles.map(v=>[v.id,v.plate+' · '+v.model]),prefill.vehicle)+select('tech','Técnico responsable',techOpts(),prefill.tech||source?.owner)+field('km','Kilometraje actual',prefill.km??'','number','required min="0"')+r6AttentionFields(prefill.attentionType)+field('service','Servicio inicial (opcional)',prefill.service||'','text','placeholder="Puede crear la ODS sin servicios"')+field('hours','Cantidad H-H',prefill.hours||1,'number','min="0.25" step="0.25"')+field('price','Precio final del servicio',prefill.price||0,'number','min="0" step="0.01"'),d=>{if(d.attentionType==='Otro'&&!d.attentionOther.trim())throw Error('Escriba el otro tipo de atención.');const lines=d.service.trim()?[{id:uid(),name:d.service.trim(),type:'servicio',qty:+d.hours,hours:+d.hours,price:+d.price,cost:0,tech:d.tech,supportNote:''}]:[],o={id:uid(),code:r6OrderCode(),vehicle:d.vehicle,tech:d.tech,km:+d.km,state:'Recepción',date:today(),origin:'demo',billing:'No facturado',attentionType:d.attentionType==='Otro'?d.attentionOther:d.attentionType,lines};db.orders.unshift(o);r6SyncOrderTask(o,taskId);odsState='Recepción';page='ods';r6PanelId=null;save('Nueva ODS y tarea enlazadas',o.code)})}

/* --- importes: en servicios la cantidad es H-H y NO multiplica el precio; en productos sí --- */
function r72LineSubtotal(l){if(l.price==null||l.price==='')return null;return l.type==='servicio'?r2(l.price):r2((+l.qty||0)*l.price)}
function r72LineTotal(l){const s=r72LineSubtotal(l);return s==null?null:r2(s-(+l.discount||0))}
function r72LineCost(l){if(l.cost==null||l.cost==='')return null;return l.type==='servicio'?r2(l.cost):r2((+l.qty||0)*l.cost)}
function r72LineProfit(l){const t=r72LineTotal(l),c=r72LineCost(l);return t==null||c==null?null:r2(t-c)}
function r72OrderTotal(o){const ls=o?.lines||[];if(!ls.length)return 0;return ls.every(l=>l.price!=null&&l.price!=='')?r2(ls.reduce((s,l)=>s+r72LineTotal(l),0)):null}
lineAmount=function(l){return r72LineTotal(l)};
function r72Hours(box){return q4((box.lines||[]).filter(l=>l.type==='servicio').reduce((a,l)=>a+(+l.hours||0),0))}
function r72Duration(box){const h=r72Hours(box);return h>0?h:(+box.durationH||1)}

function r72CatLabel(c){return (c.code?c.code+' - ':'')+c.name}

/* --- contenedores: «o:<id>» = ODS, «q:<id>» = cotización de una cita --- */
function r72Box(k){if(!k)return null;const [t,id]=k.split(':');return t==='o'?db.orders.find(o=>o.id===id):db.r72quotes.find(q=>q.id===id)}
function r72Cita(k){const b=r72Box(k);return k?.startsWith('q:')?db.appointments.find(a=>a.id===b?.appointment):db.appointments.find(a=>a.id===b?.appointment)}
function r72BoxVehicle(k){const b=r72Box(k);if(!b)return {};if(k.startsWith('o:'))return vehicle(b.vehicle);return vehicle(r72Cita(k)?.vehicle)}
function r72BoxLabel(k){const b=r72Box(k);if(!b)return '—';if(k.startsWith('o:'))return 'ODS '+b.code+' · '+(vehicle(b.vehicle).plate||'sin placa');const a=r72Cita(k);return b.code+' (cita '+(vehicle(a?.vehicle).plate||client(a?.client).name||'sin vehículo')+')'}
function r72BoxSched(k){const b=r72Box(k);if(!b)return null;if(k.startsWith('o:'))return {date:b.date,start:minutes(b.time||'08:00')};const a=r72Cita(k);return a?{date:a.date,start:minutes(a.time||'08:00')}:null}
function r72BoxLocked(k){const b=r72Box(k);if(!b)return true;if(k.startsWith('o:'))return b.state==='Archivada';const a=r72Cita(k);return !!b.usedBy||['Completada','Cancelada','No asistió'].includes(a?.state)&&!!a?.order}
function r72Log(k,kind,text){if(k?.startsWith('o:'))r7Log(k.slice(2),kind,text);else{const a=r72Cita(k);if(a){a.log??=[];a.log.push({date:new Date().toISOString(),actor,kind,text})}}}

/* --- refresco de modales: el modal abierto se vuelve a pintar tras cada cambio --- */
function r72Show(html,ref){const m=$('modal'),b=$('modalbody'),st=m.scrollTop;b.innerHTML=html;R72.open=ref||null;if(!m.open)m.showModal();m.scrollTop=st;if(R72.focus){const el=b.querySelector(`[data-focus="${R72.focus}"]`);R72.focus=null;if(el){el.focus();r72Suggest(el)}}}
function r72Reopen(ref=R72.open){if(!ref)return;if(ref.kind==='ods')r72OpenOrder(ref.id);else if(ref.kind==='cita')r72OpenCita(ref.id)}
function r72Commit(action,detail){const ref=R72.open,wasOpen=$('modal').open;save(action,detail);if(ref&&wasOpen)r72Reopen(ref)}

const r72SaveBase=save;

const r72CloseBase=closeModal;

/* --------------------------------------------------------------------------
   Lista editable de ítems compartida por la cotización de la cita y la ODS.
   Columnas: tipo, ítem (buscador «código - nombre»), cantidad/H-H, costo (bloqueado
   salvo logística/administrador), precio unitario, descuento, subtotal, total,
   rentabilidad, responsable y eliminar. El técnico no ve costos ni rentabilidad.
   -------------------------------------------------------------------------- */
function r72Grid(k,opts={}){
  const box=r72Box(k);if(!box)return '';box.lines??=[];
  const locked=r72BoxLocked(k)||opts.readonly,tech=r72IsTech(),com=r72Commercial(),canCost=r72CanCost(),sel=R72.sel[k]??=new Set();
  const dis=locked?'disabled':'';
  const head=['<th class="r72-ck"></th>','<th>Tipo</th>','<th class="r72-item">Ítem</th>','<th>Cant./H-H</th>',com?'<th title="Solo logística o administrador lo edita">Costo unit. 🔒</th>':'','<th>P. unitario</th>',com?'<th>Desc.</th>':'',com?'<th>Subtotal</th>':'','<th>Total</th>',com?'<th>Rentab.</th>':'','<th>Responsable</th>','<th>Estado</th>','<th></th>'].join('');
  const num=(l,f,v,extra='')=>`<input type="number" class="r72-num" ${dis} ${extra} value="${v??''}" onchange="r72Set('${k}','${l.id}','${f}',this.value)">`;
  const row=l=>{
    const svc=l.type==='servicio',profit=r72LineProfit(l),tot=r72LineTotal(l),pct=profit!=null&&tot?Math.round(profit/tot*100):null;
    const priceLocked=tech&&!svc; /* el técnico ve el precio final del producto, pero no lo cambia */
    const owners=svc?techOpts():r72Logistics().map(u=>[u.id,u.name]);
    const canDel=!locked&&(!tech||(l.createdBy===actor&&!l.approved));
    return `<tr class="${l.approved?'':'r72-new'}">
<td class="r72-ck"><input type="checkbox" ${dis} ${sel.has(l.id)?'checked':''} onchange="r72Toggle('${k}','${l.id}',this.checked)" aria-label="Seleccionar ítem"></td>
<td><select ${dis||(tech&&l.approved?'disabled':'')} onchange="r72Set('${k}','${l.id}','type',this.value)"><option value="servicio" ${svc?'selected':''}>Servicio</option><option value="producto" ${svc?'':'selected'}>Producto</option></select></td>
<td class="r72-item"><div class="r72-combo"><input ${dis} data-k="${k}" data-l="${l.id}" data-type="${l.type}" data-focus="${l.id}" value="${esc(r72LineLabel(l))}" placeholder="Escribe para buscar…" autocomplete="off" oninput="r72Suggest(this)" onfocus="r72Suggest(this)" onkeydown="r72SugKey(event,this)" onblur="r72SugHide(this)" onchange="r72SetName('${k}','${l.id}',this.value)"><div class="r72-sug" hidden></div></div>${l.external?'<small class="r72-tag">externo</small>':''}</td>
<td>${svc?num(l,'hours',l.hours,'min="0" step="0.25" title="H-H: no multiplica el precio"'):num(l,'qty',l.qty,'min="0" step="1"')}<small class="sub">${svc?'H-H':'und.'}</small></td>
${com?`<td>${canCost?num(l,'cost',l.cost,'min="0" step="0.01"'):`<span class="r72-lock">${l.cost==null?'—':money(l.cost)}</span>`}</td>`:''}
<td>${priceLocked?`<span class="r72-lock" title="Precio bloqueado para el técnico">${l.price==null?'Por cotizar':money(l.price)}</span>`:num(l,'price',l.price,'min="0" step="0.01"')}<small class="sub">${svc?'precio final':'por unidad'}</small></td>
${com?`<td>${num(l,'discount',l.discount||0,'min="0" step="0.01"')}</td><td class="r72-r">${money(r72LineSubtotal(l))}</td>`:''}
<td class="r72-r"><b>${money(tot)}</b></td>
${com?`<td class="r72-r ${profit==null?'':profit<0?'r7-error':'r7-ok'}">${profit==null?'—':money(profit)+(pct!=null?' · '+pct+'%':'')}</td>`:''}
<td><select ${dis} onchange="r72Set('${k}','${l.id}','${svc?'tech':'logistic'}',this.value)">${r72Opt(owners,svc?l.tech:l.logistic,svc?'Sin técnico':'Sin logístico')}</select></td>
<td><span class="pill ${l.approved?'green':'orange'}">${l.approved?'Aprobado':'Nuevo'}</span>${svc?'':`<small class="sub">${esc(l.logisticTag||'Por cotizar')}</small>`}</td>
<td>${canDel?`<button type="button" class="r72-trash" title="Eliminar ítem" aria-label="Eliminar ítem" onclick="r72Remove('${k}','${l.id}')">${R72_TRASH}</button>`:''}</td></tr>`};
  const cols=com?13:9,svcs=box.lines.filter(l=>l.type==='servicio'),prods=box.lines.filter(l=>l.type==='producto');
  const add=type=>locked?'':`<tr class="r72-add"><td></td><td colspan="${cols-1}"><button type="button" onclick="r72AddLine('${k}','${type}')">＋ ${type==='servicio'?'Servicio':'Producto'}</button></td></tr>`;
  const group=(t,ls)=>`<tr class="r72-group"><td colspan="${cols}">${t} · ${ls.length}</td></tr>`;
  const sum=f=>r2(box.lines.reduce((a,l)=>a+(f(l)||0),0)),hh=r72Hours(box),totalKnown=box.lines.every(l=>l.price!=null&&l.price!=='');
  const totals=`<div class="r72-totals">${com?`<span>Subtotal <b>${money(sum(r72LineSubtotal))}</b></span><span>Descuentos <b>${money(sum(l=>+l.discount||0))}</b></span>`:''}<span>Total <b>${totalKnown?money(sum(r72LineTotal)):'Pendiente de cotizar'}</b></span>${com?`<span>Costo <b>${money(sum(r72LineCost))}</b></span><span>Rentabilidad <b>${money(sum(r72LineProfit))}${sum(r72LineTotal)?' · '+Math.round(sum(r72LineProfit)/sum(r72LineTotal)*100)+'%':''}</b></span>`:''}<span>H-H <b>${hh}</b></span></div>`;
  const bulk=sel.size&&!locked?`<div class="r6-bulk r72-bulk"><b>${sel.size} seleccionados</b><label>Asignar logístico<select id="r72-bulk-log">${r72Opt(r72Logistics().map(u=>[u.id,u.name]))}</select></label>${button('Aplicar a productos',`r72BulkLogistic('${k}')`,true)}<label>Asignar técnico<select id="r72-bulk-tech">${r72Opt(techOpts())}</select></label>${button('Aplicar a servicios',`r72BulkTech('${k}')`)}${button('Quitar selección',`R72.sel['${k}'].clear();r72Refresh()`)}</div>`:'';
  return `<div class="panel space r72-gridbox"><div class="row spread"><h3>${esc(opts.title||'Detalle')}</h3><span class="sub">${locked?'Bloqueado':'Escribe en «Ítem» para buscar por código o por cualquier palabra del nombre'}</span></div>${bulk}<div class="scroll"><table class="r72-grid"><thead><tr>${head}</tr></thead><tbody>${group('Servicios',svcs)}${svcs.map(row).join('')}${add('servicio')}${group('Productos',prods)}${prods.map(row).join('')}${add('producto')}</tbody></table></div>${totals}<p class="sub">Servicios: la cantidad son H-H y no cambia el precio final. Productos: cantidad × precio unitario. Un ítem nuevo deja la decisión del cliente en Pendiente hasta que caja la apruebe.</p></div>`;
}

/* --- buscador: coincide con cualquier parte del código o del nombre --- */
function r72Matches(q,type){const n=normal(q);return db.catalog.filter(c=>!c.deleted&&(!type||c.type===type)&&(!n||normal(r72CatLabel(c)).includes(n))).slice(0,12)}
function r72Suggest(input){const box=input.parentElement.querySelector('.r72-sug');if(!box)return;const items=r72Matches(input.value,input.dataset.type);box.innerHTML=items.map((c,i)=>`<button type="button" class="${i===0?'hl':''}" onmousedown="event.preventDefault();r72Pick('${input.dataset.k}','${input.dataset.l}','${c.id}')"><b>${esc(c.code||'—')}</b> - ${esc(c.name)}<small>${c.type==='servicio'?(c.hours??'—')+' H-H · ':''}${money(c.price)}${c.type==='producto'?(c.stock===false?' · sin stock':' · en stock'):''}</small></button>`).join('')||'<div class="sub r72-none">Sin coincidencias: se guardará como ítem externo</div>';box.hidden=false}
function r72SugHide(input){setTimeout(()=>{const b=input.parentElement?.querySelector('.r72-sug');if(b)b.hidden=true},160)}
function r72SugKey(e,input){const box=input.parentElement.querySelector('.r72-sug'),bs=[...box.querySelectorAll('button')];if(!bs.length)return;let i=bs.findIndex(b=>b.classList.contains('hl'));if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();bs[i]?.classList.remove('hl');i=(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[i].classList.add('hl')}else if(e.key==='Enter'&&!box.hidden&&i>=0){e.preventDefault();bs[i].dispatchEvent(new MouseEvent('mousedown'))}else if(e.key==='Escape')box.hidden=true}

function r72Line(k,id){return r72Box(k)?.lines.find(l=>l.id===id)}
function r72Announce(k,l){ /* primera vez que el ítem tiene nombre: aprobación y logística */
  if(l.announced||!l.name)return;l.announced=true;const box=r72Box(k);
  if(k.startsWith('o:')){if(box.approval==='Aprobada'){box.approval='Pendiente';r7Log(box.id,'Reaprobación requerida','Se agregó «'+r72LineLabel(l)+'». La decisión del cliente volvió a Pendiente (No aprobado) hasta que caja lo confirme.')}r7Log(box.id,'Ítem agregado',l.type+': '+r72LineLabel(l)+' · por '+tech(actor))}
  else r72Log(k,'Ítem agregado',r72LineLabel(l));
  if(l.type==='producto'){l.logistic??=box.logistic||null;if(l.logistic)r72EnsureLogTask(k,'cotizar',l.logistic,[l.id],r72IsTech()&&k.startsWith('o:'))}
}
function r72Pick(k,id,catId){const l=r72Line(k,id),c=db.catalog.find(x=>x.id===catId);if(!l||!c)return;R72.picked={id,at:Date.now()};Object.assign(l,{code:c.code||'',name:c.name,type:c.type,catalog:c.id,external:false});if(c.type==='servicio'){l.hours=c.hours??l.hours??0;l.qty=l.hours;if(l.price==null||!l.priceTouched)l.price=c.price??null;l.cost??=0}else{l.qty=l.qty||1;l.price=c.price??null;l.cost=c.cost??null;l.stock=c.stock!==false;l.logisticTag=c.stock===false?'Por cotizar':'Cotizado'}r72Announce(k,l);r72AfterLine(k);r72Commit('Ítem seleccionado del catálogo',r72LineLabel(l))}
function r72SetName(k,id,value){const l=r72Line(k,id);if(!l)return;if(R72.picked?.id===id&&Date.now()-R72.picked.at<800)return; /* el input reemplazado dispara change al desaparecer */const v=value.trim(),hit=db.catalog.find(c=>normal(r72CatLabel(c))===normal(v)||normal(c.name)===normal(v));if(hit)return r72Pick(k,id,hit.id);l.name=v.replace(/^[A-Z]\d{3,5}\s*-\s*/,'');l.code='';l.catalog=null;l.external=!!v;r72Announce(k,l);r72Commit('Ítem externo',v)}
function r72Set(k,id,field,value){const l=r72Line(k,id),box=r72Box(k);if(!l)return;const n=v=>v===''?null:+v;
  if(field==='type'){l.type=value;if(value==='servicio'){l.hours=l.hours??l.qty??0;l.tech??=box.tech||null}else{l.qty=Math.max(1,Math.round(+l.qty||1));l.logistic??=box.logistic||null;l.logisticTag??='Por cotizar'}}
  else if(field==='hours'){const h=q4(n(value)||0);if(h!==(+value||0))toast('Las H-H avanzan en pasos de 0.25.');l.hours=h;l.qty=h}
  else if(field==='qty')l.qty=Math.max(0,n(value)||0);
  else if(field==='price'){l.price=n(value);l.priceTouched=true}
  else if(field==='cost'){if(!r72CanCost())return toast('El costo solo lo registra logística o el administrador.');l.cost=n(value);if(l.type==='producto'&&l.cost!=null&&(!l.logisticTag||l.logisticTag==='Por cotizar'))l.logisticTag='Cotizado'}
  else if(field==='discount')l.discount=Math.max(0,n(value)||0);
  else if(field==='tech')l.tech=value||null;
  else if(field==='logistic'){l.logistic=value||null;if(l.logistic&&l.name&&!['Comprado','Entregado','Conforme'].includes(l.logisticTag))r72EnsureLogTask(k,'cotizar',l.logistic,[l.id])}
  if(['hours','tech','type'].includes(field))r72AfterLine(k);
  r72Commit('Ítem actualizado',r72LineLabel(l)+' · '+field)}
function r72AddLine(k,type){const box=r72Box(k);if(r72BoxLocked(k))return toast('Este detalle está bloqueado.');const l={id:uid(),type,code:'',name:'',qty:type==='servicio'?0:1,hours:type==='servicio'?0:null,price:null,cost:type==='servicio'?0:null,discount:0,tech:type==='servicio'?(box.tech||null):null,logistic:type==='producto'?(box.logistic||null):null,approved:false,createdBy:actor,createdAt:new Date().toISOString(),logisticTag:type==='producto'?'Por cotizar':null};box.lines.push(l);R72.focus=l.id;r72Commit('Fila agregada',type)}
function r72Remove(k,id){const box=r72Box(k),i=box.lines.findIndex(l=>l.id===id);if(i<0)return;const l=box.lines[i];if(l.name&&!confirm('¿Eliminar «'+r72LineLabel(l)+'»? Queda registrado en la bitácora.'))return;box.lines.splice(i,1);if(k.startsWith('o:')){db.removedOrderLines.push({...l,order:box.id,removedAt:new Date().toISOString(),removedBy:actor});if(l.name)r7Log(box.id,'Ítem retirado',l.type+': '+r72LineLabel(l)+' · '+money(r72LineTotal(l)))}else if(l.name)r72Log(k,'Ítem retirado',r72LineLabel(l));R72.sel[k]?.delete(id);r72AfterLine(k);r72Commit('Ítem eliminado',r72LineLabel(l))}
function r72Toggle(k,id,on){const s=R72.sel[k]??=new Set();on?s.add(id):s.delete(id);r72Refresh()}
function r72BulkLogistic(k){const u=$('r72-bulk-log')?.value,box=r72Box(k),ids=[...(R72.sel[k]||[])].filter(id=>r72Line(k,id)?.type==='producto');if(!u||!ids.length)return toast('Selecciona productos y un logístico.');ids.forEach(id=>r72Line(k,id).logistic=u);const pend=ids.filter(id=>{const l=r72Line(k,id);return l.name&&!['Comprado','Entregado','Conforme'].includes(l.logisticTag)});if(pend.length)r72EnsureLogTask(k,'cotizar',u,pend);R72.sel[k].clear();r72Log(k,'Productos asignados',ids.length+' productos asignados a '+tech(u));r72Commit('Productos asignados a logística',box.code)}
function r72BulkTech(k){const u=$('r72-bulk-tech')?.value,ids=[...(R72.sel[k]||[])].filter(id=>r72Line(k,id)?.type==='servicio');if(!u||!ids.length)return toast('Selecciona servicios y un técnico.');ids.forEach(id=>r72Line(k,id).tech=u);R72.sel[k].clear();r72AfterLine(k);r72Commit('Servicios asignados',tech(u))}

/* --- duración del evento: al estirar o encoger, las H-H se reparten en proporción --- */
function r72SetDuration(k,value){const box=r72Box(k),target=q4(+value);if(!(target>0))return toast('La duración debe ser mayor que cero y en pasos de 0.25 h.');const svc=box.lines.filter(l=>l.type==='servicio'),sum=r72Hours(box);
  if(sum>0){let acc=0;const raw=svc.map(l=>(+l.hours||0)/sum*target);svc.forEach((l,i)=>{l.hours=Math.max(0,Math.floor(raw[i]*4)/4)});acc=r72Hours(box);let rest=Math.round((target-acc)*4);const order=svc.map((l,i)=>[raw[i]-l.hours,i]).sort((a,b)=>b[0]-a[0]);for(let j=0;rest>0;j=(j+1)%order.length,rest--)svc[order[j][1]].hours+=0.25;svc.forEach(l=>l.qty=l.hours);r72Log(k,'Duración ajustada','H-H totales '+sum+' → '+target+'; reparto proporcional: '+svc.map(l=>r72LineLabel(l)+' '+l.hours).join(', '))}
  else{box.durationH=target;r72Log(k,'Duración ajustada','Sin H-H asignadas: el evento se estira a '+target+' h')}
  r72AfterLine(k);r72Commit('Duración del evento',target+' h')}
function r72AfterLine(k){r72SyncBlocks(k);r72SyncEvent(k)}


/* --------------------------------------------------------------------------
   Tarea de tipo Evento (etiqueta Cita u Orden de servicio) con subtareas de
   tipo Servicio y Producto. Reemplaza la tarea de tipo «Orden de servicio».
   -------------------------------------------------------------------------- */
function r6TaskTypes(){return ['Tarea','Proyecto','Evento','Servicio','Producto']}
function r72EventOf(k){return db.tasks.find(t=>t.type==='Evento'&&t.r72k===k&&!t.deleted)}
function r72CitaTaskState(s){return {Pendiente:'Pendiente',Confirmada:'En proceso',Completada:'Completada',Cancelada:'Cancelada','No asistió':'Cancelada'}[s]||'Pendiente'}
function r72SyncEvent(k){
  const box=r72Box(k);if(!box)return null;const isO=k.startsWith('o:'),a=r72Cita(k),sch=r72BoxSched(k),v=r72BoxVehicle(k);
  let t=r72EventOf(k);
  if(!t){t={id:uid(),type:'Evento',r72k:k,priority:'Normal',list:'operativa',createdBy:actor,createdAt:new Date().toISOString(),description:'',tags:'',deleted:false};db.tasks.push(t)}
  const tag=isO?'Orden de servicio':'Cita',end=sch?r72End(sch.date,sch.start,r72Duration(box)):null;
  Object.assign(t,{eventTag:tag,title:tag+' · '+(v.plate||client(a?.client).name||'Sin vehículo')+' · '+(isO?box.code:box.code),owner:box.tech||a?.tech||t.owner||actor,
    start:sch?.date||today(),end:sch?.date||today(),due:sch?.date||today(),startTime:sch?timeText(sch.start):'08:00',endTime:end!=null?timeText(Math.round(end)):'09:00',
    orderId:isO?box.id:(a?.order||null),appointmentId:a?.id||t.appointmentId||null,
    state:isO?(box.state==='Archivada'?'Completada':'En proceso'):r72CitaTaskState(a?.state),description:isO?(box.reason||box.attentionType||''):(a?.note||'')});
  if(isO)box.taskId=t.id;else if(a)a.eventTask=t.id;
  const ids=new Set(box.lines.filter(l=>l.name).map(l=>l.id));
  db.tasks.filter(s=>s.parent===t.id&&s.r72line&&!ids.has(s.r72line)).forEach(s=>s.deleted=true);

/* --- agenda: un evento ocupa todo el ancho salvo que se cruce con otro (como Google Calendar) --- */
function r72Lanes(blocks){const out=new Map();let cluster=[],end=-1;const flush=()=>{const lanes=[];cluster.forEach(b=>{let i=lanes.findIndex(e=>e<=b.start);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=blockEnd(b);out.set(b.id,{lane:i})});cluster.forEach(b=>out.get(b.id).n=lanes.length);cluster=[]};blocks.forEach(b=>{if(cluster.length&&b.start>=end){flush();end=-1}cluster.push(b);end=Math.max(end,blockEnd(b))});flush();return out}
agendaColumn=function(id){const s=scheduleFor(selectedDate),blocks=db.blocks.filter(b=>b.tech===id&&b.date===selectedDate).sort((a,b)=>a.start-b.start||blockEnd(b)-blockEnd(a)),lay=r72Lanes(blocks),now=new Date(),todayLine=selectedDate===today()?agendaY(now.getHours()*60+now.getMinutes(),selectedDate):null;
  return `<div class="tech-column r5col" data-tech="${id}" onclick="slotClickR5(event,'${id}')"><div class="lunch-band" style="top:${agendaY(s.lunchStart*60,selectedDate)}px;height:${agendaY(s.lunchEnd*60,selectedDate)-agendaY(s.lunchStart*60,selectedDate)}px">Almuerzo</div>${todayLine!=null?`<div class="now-line" style="top:${todayLine}px"><span>${timeText(now.getHours()*60+now.getMinutes())}</span></div>`:''}${blocks.map(b=>{const {lane,n}=lay.get(b.id),w=100/n,v=blockVehicle(b),top=agendaY(b.start,b.date),height=Math.max(34,agendaY(blockEnd(b),b.date)-top),tag=b.r72k?.startsWith('q:')?'Cita':b.order?'Orden de servicio':b.appointment?'Cita previa':b.express?'Servicio express':'Sin cita previa';
    return `<div class="work-block ${b.r72k?.startsWith('q:')?'r72-bcita':''}" data-r5block="${b.id}" style="top:${top}px;height:${height}px;left:calc(${lane*w}% + 3px);width:calc(${w}% - 6px)"><div class="resize top" data-r5mode="start">═</div><div class="block-content" data-r5mode="move"><b>${esc(v.plate||'Express')} · ${esc(v.model||'')}</b><small>${esc(b.name)}</small><small>${timeText(b.start)}–${timeText(blockEnd(b))} · ${b.hours} H-H</small><span>${tag}</span></div><div class="resize bottom" data-r5mode="end">═</div></div>`}).join('')}</div>`};

/* --------------------------------------------------------------------------
   Línea temporal R7.2: la tasa km/mes ya no es editable (sale de las últimas
   5 ODS con km); filtros debajo del panel de recordatorio; Categoría y
   Actividad en columnas separadas y filas compactas; las ODS sin km se ubican
   en su mes con la etiqueta «sin km» (sin columna aparte).
   -------------------------------------------------------------------------- */
function r72Rate(valid){const pts=valid.slice(-5);if(pts.length<2)return {rate:null,pts};const a=pts[0],b=pts.at(-1),days=(new Date(b.date+'T12:00:00')-new Date(a.date+'T12:00:00'))/864e5;if(days<=0||b.km<=a.km)return {rate:null,pts};return {rate:Math.round((b.km-a.km)/(days/30.4375)),pts}}
timelineModel=function(){const v=vehicle(timelineVehicle),hist=historyFor(v),valid=hist.filter(o=>o.km!=null),last=valid.at(-1),info=r72Rate(valid),rate=info.rate||0;
  const estimate=last?Math.round(last.km+(rate?Math.max(0,(new Date(today()+'T12:00:00')-new Date(last.date+'T12:00:00'))/864e5)/30.4375*rate:0)):(+v.km||0);
  const minKm=valid.length?Math.min(...valid.map(o=>o.km)):estimate,start=binKm(minKm),end=binKm(Math.max(estimate,last?.km||0))+60000;
  const bins=Array.from({length:Math.floor((end-start)/5000)+1},(_,i)=>start+i*5000),plan=db.plans.find(p=>p.id===v.plan);return {v,hist,last,rate,rateInfo:info,estimate,bins,plan,cfg:{}}};
function r72KmAt(m,date){const pts=m.hist.filter(o=>o.km!=null);if(!pts.length||date<pts[0].date)return null;for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];if(date>=a.date&&date<=b.date){const span=(new Date(b.date)-new Date(a.date))||1;return Math.round(a.km+(b.km-a.km)*(new Date(date)-new Date(a.date))/span)}}const l=pts.at(-1);return m.rate?Math.round(l.km+(new Date(date)-new Date(l.date))/864e5/30.4375*m.rate):l.km}
function r72NoKmCol(m,o){const km=r72KmAt(m,o.date);return km!=null&&km>=m.bins[0]&&km<m.bins.at(-1)+5000?'k'+binKm(km):'m'+o.date.slice(0,7)}
function r72MonthName(ym){return new Date(ym+'-15T12:00:00').toLocaleDateString('es-PE',{month:'short',year:'numeric'})}
timelineMatrix=function(m,current){if(!m.plan)return '<div class="panel">Vehículo sin plan explícito: no se genera proyección.</div>';
  const noKm=m.hist.filter(o=>o.km==null),months=[...new Set(noKm.map(o=>r72NoKmCol(m,o)).filter(c=>c[0]==='m'))].sort();
  const cols=[...months.map(c=>({key:c,month:c.slice(1)})),...m.bins.map(k=>({key:'k'+k,km:k}))];
  const cls=c=>c.km==null?'r72-mcol':[c.km===binKm(m.last?.km)?'lastcol':'',c.km===binKm(current)?'simcol':''].join(' ');
  const label=k=>{const known=m.hist.find(o=>o.km!=null&&binKm(o.km)===k);if(known)return known.date.slice(0,7)+' · registro';if(!m.last||!m.rate)return 'mes sin estimar';return new Date(new Date(m.last.date+'T12:00:00').getTime()+(k-m.last.km)/m.rate*30.4375*864e5).toLocaleDateString('es-PE',{month:'short',year:'numeric'})+' · est.'};
  const head=c=>c.km==null?`<th class="r72-mcol">${esc(r72MonthName(c.month))}<small>sin km · por fecha</small></th>`:`<th class="${cls(c)}">${c.km.toLocaleString('es-PE')} km<small>${label(c.km)}</small>${c.km===binKm(m.last?.km)?'<small>Último registro</small>':''}${c.km===binKm(current)?'<small>Simulación actual</small>':''}</th>`;
  const noKmMark=o=>`<button class="tlmark real r72-nokm" onclick="openOrder('${o.id}')">✓ Registrado <span class="r72-tag">sin km</span><small>${esc(o.date)} · ODS ${esc(o.code)}</small></button>`;
  const cell=(r,c)=>{let h='';if(c.km!=null)h+=timelineCell(r,m,c.km);h+=noKm.filter(o=>r72NoKmCol(m,o)===c.key&&o.lines.some(l=>ruleMatches(r.f?m.plan.rules.find(x=>normal(x.n).includes('aceite')&&normal(x.n).includes('motor')):r,l))).map(noKmMark).join('');return `<td class="${cls(c)}"><div class="tlcell">${h}</div></td>`};
  const odsCell=c=>`<td class="${cls(c)}"><div class="tlcell">${c.km!=null?m.hist.filter(o=>o.km!=null&&binKm(o.km)===c.km).map(o=>`<button class="ods-chip" onclick="openOrder('${o.id}')"><b>#${esc(o.code)}</b><small>${o.date} · ${o.km.toLocaleString('es-PE')} km</small></button>`).join(''):''}${noKm.filter(o=>r72NoKmCol(m,o)===c.key).map(o=>`<button class="ods-chip r72-nokm" onclick="openOrder('${o.id}')"><b>#${esc(o.code)}</b> <span class="r72-tag">sin km</span><small>${o.date}${o.kmFlag?' · km '+o.kmOriginal.toLocaleString('es-PE')+' excluido':''}</small></button>`).join('')}</div></td>`;
  const bad=m.hist.filter(o=>o.kmFlag);
  return `<div class="tl-scroll r72-tl"><table class="tlmatrix"><thead><tr><th class="r72-cat">Categoría</th><th class="r72-act">Actividad</th>${cols.map(head).join('')}</tr></thead><tbody>${m.plan.rules.map(r=>`<tr><td class="r72-cat">${esc(r.c||timelineCategory(r))}</td><td class="r72-act"><b>${esc(r.n)}</b><small>${tlRuleLabel(r,m)}</small></td>${cols.map(c=>cell(r,c)).join('')}</tr>`).join('')}<tr class="ods-band"><td class="r72-cat">Historial</td><td class="r72-act"><b>ODS reales</b><small>fechas originales</small></td>${cols.map(odsCell).join('')}</tr></tbody></table></div>
<p class="sub">Columnas por km (desde su km hasta el siguiente). Una ODS sin km se ubica en la columna cuyo km estimado corresponde a su fecha (interpolando entre lecturas reales) con la etiqueta «sin km»; si es anterior a la primera lectura, va en una columna por mes sin kilometraje.</p>${bad.length?`<p class="banner">Lecturas de km inconsistentes excluidas de la proyección (la ODS no se modifica): ${bad.map(o=>`ODS ${esc(o.code)} · ${esc(o.date)} · ${o.kmOriginal.toLocaleString('es-PE')} km (${o.kmFlag})`).join('; ')}.</p>`:''}`};
views.timeline=()=>{const m=timelineModel(),v=m.v,current=simKm??m.estimate,ri=m.rateInfo;
  return heading('Línea temporal','Historial, meses y kilometraje en una sola matriz',button('Imprimir / PDF','window.print()'))+
`<div class="grid space"><div class="panel"><small>Último ingreso con km</small><h2>${m.last?.km?.toLocaleString('es-PE')||'Sin lectura'} km</h2><p>${esc(m.last?.date||'')} · ODS ${esc(m.last?.code||'—')}</p></div>
<div class="panel"><small>Hoy estimado, no lectura real</small><h2>${m.estimate?.toLocaleString('es-PE')} km</h2><p><b>${m.rate?m.rate.toLocaleString('es-PE')+' km/mes':'Sin tasa'}</b> · ${m.rate?'según las últimas '+ri.pts.length+' ODS con km ('+ri.pts.map(o=>'#'+esc(o.code)).join(', ')+')':'se necesitan al menos 2 ODS con km'} · ${today()}</p></div>
<div class="panel"><small>Simulación</small><h2>${Math.round(current).toLocaleString('es-PE')} km</h2><input aria-label="Simular kilometraje" type="range" min="${m.bins[0]}" max="${m.bins.at(-1)}" step="500" value="${current}" onchange="simKm=+this.value;render()">${button('Restablecer','simKm=null;render()')}</div>
<div class="panel"><small>Plan explícito del vehículo</small><h2>${esc(m.plan?.id||'Sin plan')}</h2><p>Reglas no aprobadas técnicamente.</p></div></div>
<p class="banner">Aceite: 5.000 km cuando no se especifica tipo, mineral o semisintético; sintético y full sintético: 7.500 km. Parámetros operativos declarados como validados por el administrador general; la validación mecánica formal sigue separada.</p>
${reminderPanel()}
<div class="filterbar"><label>Vehículo<select onchange="timelineVehicle=this.value;simKm=null;render()">${db.vehicles.map(x=>`<option value="${x.id}" ${x.id===timelineVehicle?'selected':''}>${esc(x.plate+' · '+x.model)}</option>`).join('')}</select></label><label>Uso<select onchange="vehicle(timelineVehicle).use=this.value;save('Uso del vehículo',timelineVehicle)"><option value="S" ${v.use==='S'?'selected':''}>Severo</option><option value="P" ${v.use==='P'?'selected':''}>Particular</option></select></label><label>Aceite<select onchange="vehicle(timelineVehicle).oil=this.value;save('Aceite elegido',timelineVehicle)">${['','Mineral','Semisintético','Sintético','Full sintético'].map(s=>`<option ${s===(v.oil||'')?'selected':''} value="${s}">${s||'Sin seleccionar'}</option>`).join('')}</select></label></div>
<p class="r72-legend">✓ Registrado · <span class="r72-tag">sin km</span> ODS ubicada por fecha · ! Vencido (solo el primer pendiente; km o tiempo, lo que ocurra primero) · ◇ Programado · ○ Condicional · ? Sin registro · — Sin intervalo</p>${timelineMatrix(m,current)}`};


/* --------------------------------------------------------------------------
   Reportes (estructura inspirada en los reportes de Tuulapp): Ventas, Ventas por
   ítems, Operaciones y Técnicos. Filtros a la izquierda, gráfica mensual a la
   derecha, tabla con búsqueda y filtro por columna, descarga CSV.
   Fuente: notas de venta internas (no SUNAT) y órdenes de servicio.
   -------------------------------------------------------------------------- */
const R72_TABS=[['ventas','Ventas'],['items','Ventas por ítems'],['operaciones','Operaciones'],['tecnicos','Técnicos'],['resumen','Resumen operativo']];
function r72MonthBounds(){const d=new Date(today()+'T12:00:00'),y=d.getFullYear(),m=d.getMonth();return [new Date(y,m,1).toLocaleDateString('en-CA'),new Date(y,m+1,0).toLocaleDateString('en-CA')]}
function r72F(tab){const [a,b]=r72MonthBounds();return R72.rf[tab]??={desde:a,hasta:b,tipoFiltro:'ingreso',calculo:'horas'}}
function r72SetF(tab,k,v){r72F(tab)[k]=v;render()}
function r72VehText(v){return v?.plate?`${v.brand||''}, Modelo: ${v.model||''} Placa: ${v.plate}`:'—'}
function r72NoteRows(){return db.notes.filter(n=>n.state!=='Anulada').map(n=>{const o=db.orders.find(x=>x.id===n.order)||{lines:[]},v=vehicle(o.vehicle),c=client(v.client),pays=[...db.advances.filter(x=>x.order===o.id),...db.payments.filter(p=>p.order===o.id)],paid=pays.reduce((a,x)=>a+(+x.amount||0),0),acc=db.bankAccounts.find(x=>x.id===pays[0]?.account);return {n,o,v,c,date:(n.createdAt||'').slice(0,10),tipo:paid+0.005>=n.total?'Contado':'Crédito',banco:acc?.name||'—',medio:pays[0]?.method||'—',total:+n.total||0}})}
function r72Months(hasta,count=6){const d=new Date(hasta+'T12:00:00'),out=[];for(let i=count-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.toLocaleDateString('en-CA').slice(0,7))}return out}
function r72Chart(title,points,unit){const W=640,H=250,L=56,R=34,T=18,B=30,max=Math.max(1,...points.map(p=>p[1])),step=Math.pow(10,Math.floor(Math.log10(max))),nice=Math.ceil(max/step)*step,ticks=[0,.25,.5,.75,1].map(f=>f*nice),x=i=>L+(points.length<2?0:i*(W-L-R)/(points.length-1)),y=v=>T+(H-T-B)*(1-v/nice),fmt=v=>unit==='h'?v.toLocaleString('es-PE',{maximumFractionDigits:2})+' h':'S/ '+v.toLocaleString('es-PE',{maximumFractionDigits:0});
  return `<div class="panel r72-chart"><h3>${esc(title)}</h3><p class="sub">Análisis de los últimos meses · total por mes</p><div class="r72-chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}: ${points.map(p=>p[0]+' '+fmt(p[1])).join('; ')}">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" class="r72-gridl"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" class="r72-axis">${unit==='h'?t:t>=1000?(t/1000)+'k':t}</text>`).join('')}<polyline fill="none" class="r72-line" points="${points.map((p,i)=>x(i)+','+y(p[1])).join(' ')}"/>${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="4" class="r72-dot"/><text x="${x(i)}" y="${H-10}" text-anchor="middle" class="r72-axis">${p[0]}</text><rect x="${x(i)-24}" y="${T}" width="48" height="${H-T-B}" fill="transparent" onmouseenter="r72Tip(this,'${p[0]}','${fmt(p[1])}')" onmouseleave="r72Tip()"/>`).join('')}</svg><div class="r72-tip" hidden></div></div></div>`}
function r72Tip(el,label,val){const tip=document.querySelector('.r72-tip');if(!tip)return;if(!el){tip.hidden=true;return}const r=el.getBoundingClientRect(),w=el.closest('.r72-chartwrap').getBoundingClientRect();tip.innerHTML=`<b>${label}</b><br>${val}`;tip.style.left=(r.left-w.left+r.width/2)+'px';tip.style.top='8px';tip.hidden=false}
function r72Filters(tab,defs){const f=r72F(tab);return `<div class="r72-filters"><b>Filtros</b>${defs.map(([key,label,type,opts])=>`<label class="r72-ig"><span>${label}</span>${type==='date'?`<input type="date" value="${esc(f[key]||'')}" onchange="r72SetF('${tab}','${key}',this.value)">`:`<select onchange="r72SetF('${tab}','${key}',this.value)">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(f[key]??'')===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select>`}</label>`).join('')}<button class="primary r72-dl" onclick="r72Download('${tab}')">⭳ DESCARGAR</button></div>`}
const R72_ALL=[['','-TODOS-']];
function r72ClientOpts(){return R72_ALL.concat(db.clients.map(c=>[c.id,c.name]))}
function r72VehOpts(){return R72_ALL.concat(db.vehicles.map(v=>[v.id,v.plate+' · '+v.model]))}
function r72InRange(d,f){return d&&(!f.desde||d>=f.desde)&&(!f.hasta||d<=f.hasta)}
function r72Search(input){const q=normal(input.value);input.closest('.r72-report').querySelectorAll('table tbody tr').forEach(tr=>{tr.dataset.s=q&&!normal(tr.innerText).includes(q)?'1':'';tr.style.display=tr.dataset.s?'none':''})}
function r72Data(tab){const f=r72F(tab);
  if(tab==='ventas'){const rows=r72NoteRows().filter(r=>(!f.medio||r.medio===f.medio)&&(!f.tipo||r.tipo===f.tipo)&&(!f.banco||r.banco===f.banco)&&(!f.cliente||r.v.client===f.cliente)&&(!f.vehiculo||r.v.id===f.vehiculo));
    return {all:rows,rows:rows.filter(r=>r72InRange(r.date,f)),date:r=>r.date,value:r=>r.total,head:['Emisión','# Nota','# ODS','Cliente','Identificación','Vehículo','Tipo/Venta','Cuenta / banco','Medio de pago','Base imponible','Impuesto','Total'],cells:r=>[r.date,r.n.code,r.o.code||'—',r.c.name||'—',r.c.doc||'(Sin identificación)',r72VehText(r.v),r.tipo,r.banco,r.medio,money(r.total),money(0),money(r.total)]}}
  if(tab==='items'){const rows=r72NoteRows().filter(r=>(!f.cliente||r.v.client===f.cliente)&&(!f.vehiculo||r.v.id===f.vehiculo)).flatMap(r=>r.o.lines.map(l=>({...r,l})));

  return db.purchaseInvoices.map(inv=>{const s=db.suppliers.find(x=>x.id===inv.supplier)||{},t=r73PurTotal(inv),p=r73PurPaid(inv);return {kind,id:inv.id,code:inv.code,date:inv.date,due:inv.due||inv.date,party:s.id||'sin',partyName:s.name||'Sin proveedor',partyDoc:s.doc||'',total:t,paid:p,saldo:Math.max(0,r2(t-p))}})}
function r73DueTag(d){if(!d.saldo)return '<span class="pill green">Pagado</span>';const days=Math.round((new Date(d.due+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);return days<0?'<span class="pill red">Vencido</span>':days===0?'<span class="pill orange">Vence hoy</span>':`<span class="pill orange">Vence en ${days} d</span>`}

  let body;if(R73.cxView==='comprobante')body=table(['Acciones','Fecha','Comprobante',who,'Valor',k==='cobrar'?'Recibido':'Pagado','Saldo','Vencimiento','Estado'],docs.map(d=>[r73Act(d.saldo?r73Btn('pay','Registrar pago',`r73PayDoc('${k==='cobrar'?'note':'purchase'}','${d.id}')`):'',r73Btn('open','Ver cuenta del '+who.toLowerCase(),`r73Account('${k}','${d.party}','${d.id}')`)),esc(d.date),`<b>${esc(d.code)}</b>`,esc(d.partyName),money(d.total),money(d.paid),money(d.saldo),esc(d.due),r73DueTag(d)]));
  else{const g={};docs.forEach(d=>{(g[d.party]??={party:d.party,name:d.partyName,doc:d.partyDoc,total:0,saldo:0,n:0});g[d.party].total+=d.total;g[d.party].saldo+=d.saldo;g[d.party].n++});const rows=Object.values(g);body=table(['Acciones','Nro. doc.','Razón social','Comprobantes','Deuda','Saldo'],rows.map(r=>[r73Act(r73Btn('$','Ver cuenta y pagar',`r73Account('${k}','${r.party}')`)),esc(r.doc||'—'),`<b>${esc(r.name)}</b>`,r.n,money(r.total),money(r.saldo)]))+`<p class="r72-r"><b>Total deuda ${money(rows.reduce((a,r)=>a+r.total,0))} · Saldo ${money(rows.reduce((a,r)=>a+r.saldo,0))}</b></p>`}
  return heading('Cuentas por cobrar y por pagar','Por comprobante o agrupadas por cliente/proveedor. Abre la cuenta para ver todos sus comprobantes, pagar uno y descargar el estado de cuenta.')+bar+`<div class="panel">${body}</div>`};

  const pays=kind==='cobrar'?r73NotePays(sel.id):(db.purchaseInvoices.find(x=>x.id===sel.id).payments||[]);
