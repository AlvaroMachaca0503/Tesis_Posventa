<div class="panel space"><h3>Pagos de ${esc(sel.code)}</h3><table class="r72-grid"><thead><tr><th></th><th>Fecha</th><th>Cuenta</th><th>Observación</th><th class="r72-r">Importe</th></tr></thead><tbody>${pays.map(p=>`<tr><td>${p.locked?'':`<button type="button" class="r72-trash" title="Eliminar pago" onclick="r73DeletePay('${kind}','${sel.id}','${p.id}')">${R72_TRASH}</button>`}</td><td>${r73Date(p.date)} ${r73Time(p.date)}</td><td>${esc(r73Acc(p.account)?.name||'—')}</td><td>${esc(p.ref||p.concept||'')}</td><td class="r72-r">${money(p.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="sub">Sin pagos</td></tr>'}</tbody></table></div></div>
<div class="panel r73-payform"><h3>Pagar ${esc(sel.code)}</h3>${sel.saldo>0?`<form onsubmit="event.preventDefault();r73SavePay(this,'${kind==='cobrar'?'note':'purchase'}','${sel.id}')"><label>Cuenta<select name="account">${r72Opt(r73AccOpts())}</select></label><label>Método<select name="method">${r72Opt(R73_METHODS.map(x=>[x,x]))}</select></label><label>Fecha<input type="date" name="date" value="${today()}" required></label><label>Importe<input type="number" name="amount" step="0.01" min="0.01" max="${sel.saldo}" value="${sel.saldo}" required></label><label>Observación<textarea name="ref" rows="2"></textarea></label><div class="row">${button('Cancelar','closeModal()')}<button class="primary">Grabar</button></div></form>`:'<p class="r7-ok">Comprobante pagado.</p>'}</div></div><footer>${button('Cerrar','closeModal()')}</footer>`,{kind:'account'})}
function r73NotePays(noteId){const n=db.notes.find(x=>x.id===noteId);return [...db.advances.filter(x=>x.order===n.order).map(x=>({...x,ref:x.concept,locked:true})),...db.payments.filter(p=>p.note===noteId||(!p.note&&p.order===n.order))]}
function r73PayDoc(kind,id){const k=kind==='note'?'cobrar':'pagar',d=r73Docs(k).find(x=>x.id===id);r73Account(k,d.party,id)}
function r73SavePay(f,kind,id){const d=Object.fromEntries(new FormData(f)),amt=+d.amount;if(!(amt>0))return toast('Importe inválido.');const a=r73Acc(d.account),date=new Date(d.date+'T'+new Date().toTimeString().slice(0,8)).toISOString();
  if(kind==='note'){const n=db.notes.find(x=>x.id===id);db.payments.push({id:uid(),order:n.order,note:id,amount:amt,account:d.account,method:d.method,ref:d.ref||'Pago '+n.code,date,actor,seq:r73Seq()});if(a)a.balance+=amt;r7Log(n.order,'Pago recibido',n.code+' · '+money(amt)+' · '+d.method+' · '+(a?.name||''))}
  else{const inv=db.purchaseInvoices.find(x=>x.id===id);(inv.payments??=[]).push({id:uid(),amount:amt,account:d.account,method:d.method,ref:d.ref||'Pago '+inv.code,date,actor,seq:r73Seq()});if(a)a.balance-=amt;R73.lastText='Pago a proveedor '+inv.code+' · '+money(amt)}
  save('Pago registrado',money(amt));r73AccountModal()}
function r73DeletePay(k,docId,payId){if(!confirm('¿Eliminar este pago? Se revierte el saldo de la cuenta.'))return;if(k==='cobrar'){const i=db.payments.findIndex(p=>p.id===payId),p=db.payments[i];if(i<0)return;db.payments.splice(i,1);const a=r73Acc(p.account);if(a)a.balance-=p.amount;r7Log(p.order,'Pago eliminado',money(p.amount)+' · '+(p.ref||''))}else{const inv=db.purchaseInvoices.find(x=>x.id===docId),i=inv.payments.findIndex(p=>p.id===payId),p=inv.payments[i];inv.payments.splice(i,1);const a=r73Acc(p.account);if(a)a.balance+=p.amount;R73.lastText='Pago a proveedor eliminado '+inv.code+' · '+money(p.amount)}save('Pago eliminado',payId);r73AccountModal()}
function r73Statement(mode){const {kind,party}=R73.acc,docs=r73Docs(kind).filter(d=>d.party===party);const name=docs[0]?.partyName||'';

function r73Movs(accId){const out=[],cl=o=>client(vehicle(o?.vehicle).client).name||'';
  db.advances.filter(x=>x.account===accId).forEach(x=>{const o=db.orders.find(y=>y.id===x.order),a=x.appointment&&db.appointments.find(y=>y.id===x.appointment);out.push({key:'adv:'+x.id,date:x.date,seq:x.seq,detail:(x.kind||'Abono')+' '+(o?'ODS '+o.code:a?'cita '+(a.code||''):'')+' · '+(x.concept||''),contact:o?cl(o):client(a?.client).name||'',debit:x.amount,credit:0,method:x.method})});
  db.payments.filter(x=>x.account===accId).forEach(x=>{const o=db.orders.find(y=>y.id===x.order);out.push({key:'pay:'+x.id,date:x.date,seq:x.seq,detail:x.ref||'Pago',contact:cl(o),debit:x.amount,credit:0,method:x.method})});
  db.purchaseInvoices.forEach(inv=>(inv.payments||[]).filter(p=>p.account===accId).forEach(p=>out.push({key:'pp:'+p.id,date:p.date,seq:p.seq,detail:'Pago compra '+inv.code,contact:db.suppliers.find(s=>s.id===inv.supplier)?.name||'',debit:0,credit:p.amount,method:p.method})));
  db.transfers.forEach(t=>{if(t.source===accId)out.push({key:'tr:'+t.id,date:t.date,seq:t.seq,detail:'Transferencia a '+(r73Acc(t.target)?.name||'')+' · '+t.detail,contact:t.receiver,debit:0,credit:t.amount,method:'Transferencia bancaria'});if(t.target===accId)out.push({key:'tr:'+t.id,date:t.date,seq:t.seq,detail:'Transferencia desde '+(r73Acc(t.source)?.name||'')+' · '+t.detail,contact:t.receiver,debit:t.amount,credit:0,method:'Transferencia bancaria'})});
  (db.r73mov||[]).filter(m=>m.account===accId).forEach(m=>out.push({key:'mov:'+m.id,date:m.date,seq:m.seq,detail:m.detail,contact:m.contact||'',debit:m.type==='Ingreso'?m.amount:0,credit:m.type==='Egreso'?m.amount:0,method:m.method||'Efectivo',manual:true,id:m.id}));
  return out.sort((a,b)=>b.date.localeCompare(a.date))}
views.bancos=()=>{const see=r73CanSeeBank(),adm=r72Role()==='Administrador';return heading('Bancos','Cuentas bancarias y de efectivo. Efectivo separado por sede (Banco Efectivo Unión / Prohogar). Quién ve los montos se configura en Ajustes.',adm?button('+ Cuenta','r73EditAcc()',true):'')+(see?'':'<div class="r7-scope">Tu rol no ve montos. Puedes registrar ingresos y egresos.</div>')+`<div class="panel">${table(['Acciones','Nombre','Número','Tipo','Sede','Saldo inicial','Saldo actual'],db.bankAccounts.filter(a=>!a.deleted).map(a=>[r73Act(see?r73Btn('list','Movimientos',`r73MovList('${a.id}')`):'',r73Btn('add','Ingreso',`r73Mov('${a.id}','Ingreso')`,'r73-green'),r73Btn('minus','Egreso',`r73Mov('${a.id}','Egreso')`,'r73-red'),adm?r73Btn('edit','Editar',`r73EditAcc('${a.id}')`):'',adm&&!r73Movs(a.id).length?r73Btn('del','Eliminar',`r73DelAcc('${a.id}')`,'r73-red'):''),`<b>${esc(a.name)}</b>`,esc(a.number||'—'),esc(a.type),esc(a.branch?r73Sede(a.branch):'—'),see?money(a.initial||0):'•••',see?money(a.balance):'•••']))}</div>`};

function r73Mov(accId,type){form(type==='Ingreso'?'Ingresos':'Egresos',select('account','Cuenta',r73AccOpts(),accId)+(type==='Ingreso'?select('method','Método',R73_METHODS.map(x=>[x,x])):'')+field('amount',type==='Ingreso'?'Valor recibido':'Valor pagado','','number','min="0.01" step="0.01" required')+field('contact','Contacto (opcional)','','text')+field('detail',type==='Ingreso'?'Concepto de ingreso':'Concepto de pago','','textarea','required'),d=>{const a=r73Acc(d.account),m={id:uid(),account:d.account,type,amount:+d.amount,method:d.method||'Efectivo',contact:d.contact,detail:d.detail,date:new Date().toISOString(),actor,seq:r73Seq()};(db.r73mov??=[]).push(m);a.balance+=type==='Ingreso'?m.amount:-m.amount;R73.lastText=type+' '+a.name+' · '+money(m.amount)+' · '+d.detail;save(type+' registrado',a.name)})}

${cash?`<fieldset class="r73-resumen"><legend>Resumen</legend><table class="r72-grid"><thead><tr><th>Detalle</th><th class="r72-r">Débito</th><th class="r72-r">Crédito</th></tr></thead><tbody><tr><td>Saldo inicial</td><td class="r72-r">${money(a.initial||0)}</td><td></td></tr>${R73_METHODS.map(x=>`<tr><td>${x}</td><td class="r72-r">${money(by[x].d)}</td><td class="r72-r">${money(by[x].c)}</td></tr>`).join('')}<tr><td>Salidas</td><td></td><td class="r72-r">${money(sal)}</td></tr><tr><td><b>Total en caja</b></td><td></td><td class="r72-r"><b>${money((a.initial||0)+ing-sal)}</b></td></tr></tbody></table></fieldset>`:''}<footer>${button('Salir','closeModal()')}</footer>`,{kind:'movs'})}

   actividad cae en la visita igual o anterior a su vencimiento (lo que ocurra

function r74KmStatus(v,cfg){const kv=timelineVehicle,ks=simKm;try{timelineVehicle=v.id;simKm=null;const m=timelineModel();if(!m.plan)return null;const oil=r73OilRule(m);if(!oil)return null;const p=timelineRule(oil,m);if(!p.k||!p.base||!p.events[0])return null;const e=p.events[0],cur=p.cur,now=r74Now(),kmLeft=e.km-cur,days=e.date?Math.round((new Date(e.date+'T12:00:00')-now)/864e5):null;

function r74KmScan(){const c=r74AutoCfg(),out=[];db.vehicles.filter(v=>!v.deleted&&v.plan).forEach(v=>{let s;try{s=r74KmStatus(v,c.km)}catch{return}if(!s||!s.hit)return;const key='km-'+v.id+'-'+s.e.km;if(r74Has(key)||db.tasks.some(t=>t.r74auto?.kind==='km'&&t.r74auto.vehicle===v.id&&!t.deleted&&!['Completada','Cancelada'].includes(t.state)))return;const cl=client(v.client),why=s.e.kind==='vencido'?'cambio de aceite vencido':s.kmLeft<=c.km.km?'faltan '+Math.max(0,s.kmLeft).toLocaleString('es-PE')+' km':'faltan '+s.days+' días';
  out.push(r74Task({autoKey:key,title:`Consultar km · ${v.plate} (${why})`,priority:s.e.kind==='vencido'?'Alta':'Normal',tags:'Consulta km',r74auto:{kind:'km',vehicle:v.id,estimate:s.cur,oilKm:s.e.km,kmLeft:s.kmLeft,days:s.days,items:s.items},description:`Llamar a ${cl.name||'el cliente'}${cl.phone?' ('+cl.phone+')':''} y preguntar el kilometraje actual de ${v.plate}. Registrar la respuesta con «Registrar consulta de km»: la línea temporal se recalcula. No se agenda cita automáticamente.\nKm estimado hoy: ${s.cur.toLocaleString('es-PE')} · próximo cambio de aceite: ${s.e.km.toLocaleString('es-PE')} km${s.e.date?' ('+s.e.date+')':''}.\nServicios: ${s.items.map(x=>x.st+' · '+x.n).join('; ')||'—'}`}))});return out}

function r75Rebuild(){const flat=R75_NAV.flatMap(n=>n.sec?n.items:[n.id]);modules.splice(0,modules.length,...flat.map(id=>[id,...R75_MODS[id]]))}

/* --------------------------------------------------------------------------
   Tablas angostas: el ancho de cada columna se calcula según su contenido
   (máximo 150 px; Acciones y Nro. no se tocan) y el usuario lo cambia
   arrastrando el borde de la cabecera. Se guarda por usuario y por tabla;
   doble clic en el borde restablece la columna.
   -------------------------------------------------------------------------- */
const R75_MIN=48,R75_MAX=150,R75_FLOOR=52;
function r75CW(){db.r75cw??={};return db.r75cw[actor]??={}}
function r75Fit(root=document){root.querySelectorAll('table.r74-t').forEach(t=>{if(t.dataset.r75==='1'||!t.tHead)return;const hr=t.tHead.rows[0],n=hr.cells.length,stored=r75CW()[t.dataset.sig];
  let w=stored&&stored.length===n?stored.slice():null;
  if(!w){t.classList.add('r75-measure');const rows=[...t.tBodies[0].rows].filter(r=>!r.querySelector('.empty')).slice(0,40);w=[...hr.cells].map((th,j)=>{let m=th.classList.contains('r74-nro')?0:th.scrollWidth;rows.forEach(r=>{const c=r.cells[j];if(c)m=Math.max(m,c.scrollWidth)});const act=th.classList.contains('r74-act'),nro=th.classList.contains('r74-nro');return nro?46:act?Math.ceil(m+4):Math.max(R75_MIN,Math.min(R75_MAX,Math.ceil(m+4)))});t.classList.remove('r75-measure');
    const box=t.closest('.panel,.r74-tw')||t.parentElement,room=(box?.clientWidth||0)-26;
    if(room>300){const flex=[...hr.cells].map((th,j)=>!(th.classList.contains('r74-nro')||th.classList.contains('r74-act')));let tot=w.reduce((a,b)=>a+b,0),guard=0;while(tot>room&&guard++<40){const big=w.reduce((bi,x,j)=>flex[j]&&x>R75_FLOOR&&(bi<0||x>w[bi])?j:bi,-1);if(big<0)break;const cut=Math.min(w[big]-R75_FLOOR,Math.max(4,Math.ceil((tot-room)/3)));w[big]-=cut;tot-=cut}}}
  t.querySelector('colgroup')?.remove();t.insertAdjacentHTML('afterbegin','<colgroup>'+w.map(x=>`<col style="width:${x}px">`).join('')+'</colgroup>');t.style.width=w.reduce((a,b)=>a+b,0)+'px';t.classList.add('r75-fixed');t.dataset.r75='1';
  [...hr.cells].forEach((th,j)=>{if(th.classList.contains('r74-nro')||th.classList.contains('r74-act'))return;th.insertAdjacentHTML('beforeend',`<span class="r75-rz" title="Arrastra para cambiar el ancho · doble clic para restablecer" data-j="${j}"></span>`)})})}
let r75Drag=null;
document.addEventListener('mousedown',e=>{const h=e.target.closest?.('.r75-rz');if(!h)return;e.preventDefault();e.stopPropagation();const t=h.closest('table'),j=+h.dataset.j,col=t.querySelectorAll('col')[j];r75Drag={t,j,col,x:e.clientX,w:parseInt(col.style.width)||h.parentElement.offsetWidth};document.body.classList.add('r75-resizing')},true);
document.addEventListener('mousemove',e=>{if(!r75Drag)return;const {t,col,x,w}=r75Drag;col.style.width=Math.max(40,w+e.clientX-x)+'px';t.style.width=[...t.querySelectorAll('col')].reduce((a,c)=>a+(parseInt(c.style.width)||0),0)+'px'});
document.addEventListener('mouseup',()=>{if(!r75Drag)return;const {t}=r75Drag;r75Drag=null;document.body.classList.remove('r75-resizing');r75CW()[t.dataset.sig]=[...t.querySelectorAll('col')].map(c=>parseInt(c.style.width));try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}});
document.addEventListener('click',e=>{if(e.target.closest?.('.r75-rz'))e.stopPropagation()},true);
document.addEventListener('dblclick',e=>{const h=e.target.closest?.('.r75-rz');if(!h)return;const t=h.closest('table');delete r75CW()[t.dataset.sig];try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}t.dataset.r75='';t.querySelector('colgroup')?.remove();t.querySelectorAll('.r75-rz').forEach(x=>x.remove());t.style.width='';t.classList.remove('r75-fixed');r75Fit(t.parentElement)});

/* --------------------------------------------------------------------------
   Consulta de km: solo Llamada, WhatsApp u Otro (con texto), sin observación.
   «Última consulta de km» = la lectura más reciente (por fecha y hora) entre
   las consultas (vehículo / línea temporal), las ODS, las citas y las
   cotizaciones del vehículo.
   -------------------------------------------------------------------------- */
function r75Stamp(date,time){return String(date||'')+'T'+String(time||'00:00').slice(0,5)}
function r75KmEvents(v){const out=[];(v.kmReads||[]).forEach(r=>out.push({km:+r.km,stamp:r75Stamp(r.date,r.time),date:r.date,time:r.time,src:r.src||'Consulta',channel:r.channel||'',kind:'consulta'}));
  db.orders.filter(o=>o.vehicle===v.id&&o.km!=null&&o.km!==''&&!o.kmFlag&&!o.deleted).forEach(o=>out.push({km:+o.km,stamp:r75Stamp(o.date,o.time),date:o.date,time:o.time||'',src:'ODS '+(o.code||''),channel:'',kind:'ods'}));
  db.appointments.filter(a=>a.vehicle===v.id&&a.km&&!a.deleted).forEach(a=>{const at=a.kmAt?new Date(a.kmAt):new Date(a.createdAt||Date.now());out.push({km:+a.km,stamp:r75Stamp(at.toLocaleDateString('en-CA'),at.toTimeString().slice(0,5)),date:at.toLocaleDateString('en-CA'),time:at.toTimeString().slice(0,5),src:'Cita '+(a.code||''),channel:'',kind:'cita'})});
  db.r72quotes.filter(q=>q.vehicle===v.id&&q.km&&!q.deleted).forEach(q=>{const at=q.kmAt?new Date(q.kmAt):new Date(q.createdAt||Date.now());out.push({km:+q.km,stamp:r75Stamp(at.toLocaleDateString('en-CA'),at.toTimeString().slice(0,5)),date:at.toLocaleDateString('en-CA'),time:at.toTimeString().slice(0,5),src:'Cotización '+(q.code||''),channel:'',kind:'cotizacion'})});
  return out.filter(e=>e.km>0&&e.date).sort((a,b)=>a.stamp.localeCompare(b.stamp))}
function r75LastKm(v){return r75KmEvents(v).at(-1)||null}
/* La línea temporal usa la última lectura que no sea una ODS (las ODS ya son visitas reales). */
function r74LastRead(v){const e=r75KmEvents(v).filter(x=>x.kind!=='ods').at(-1);return e?{km:e.km,date:e.date,time:e.time,channel:e.src+(e.channel?' · '+e.channel:'')}:null}
function r75KmCell(v){const e=r75LastKm(v);return e?`<b>${e.km.toLocaleString('es-PE')} km</b><br><small>${esc(e.date)} ${esc(e.time||'')} · ${esc(e.src)}${e.channel?' · '+esc(e.channel):''}</small>`:'—'}
r74KmConsult=function(vid,src){const v=vehicle(vid),n=r72Now(),from=src||({timeline:'Línea temporal',vehiculos:'Vehículo',tareas:'Tarea de posventa',citas:'Cita'}[page]||'Vehículo');
  form('Consulta de kilometraje · '+esc(v.plate),field('km','Kilometraje informado por el cliente','','number','min="0" required')+field('date','Fecha de la consulta',n.date,'date','required')+field('time','Hora',n.time,'time','required')+`<label>Medio<select name="channel" onchange="this.form.querySelector('.r75-other').hidden=this.value!=='Otro';this.form.other.required=this.value==='Otro'">${r72Opt([['Llamada','Llamada'],['WhatsApp','WhatsApp'],['Otro','Otro']],'Llamada')}</select></label><label class="r75-other" hidden>Especificar el medio<input name="other" placeholder="Ej.: mensaje de voz, correo…"></label>`,d=>{const km=+d.km,last=r75LastKm(v);if(last&&km<last.km&&!confirm('El km es menor que la última lectura ('+last.km.toLocaleString('es-PE')+' km, '+last.src+'). ¿Registrar igual?'))return false;const ch=d.channel==='Otro'?('Otro: '+(d.other||'').trim()):d.channel;(v.kmReads??=[]).push({km,date:d.date,time:d.time,at:new Date().toISOString(),by:actor,channel:ch,src:from});v.km=Math.max(+v.km||0,km);
    db.tasks.filter(t=>t.r74auto?.kind==='km'&&t.r74auto.vehicle===vid&&!['Completada','Cancelada'].includes(t.state)).forEach(t=>{t.state='Completada';t.kmDone=km});
    db.comments.push({id:uid(),actor,date:new Date().toISOString(),kind:'Consulta de kilometraje',text:v.plate+': '+km.toLocaleString('es-PE')+' km ('+from+' · '+ch+', '+d.date+' '+d.time+')'});R73.lastText='Consulta de km '+v.plate+': '+km+' km ('+ch+')';save('Consulta de kilometraje',v.plate)})};

views.vehiculos=()=>heading('Vehículos','Grupo y plan se asignan automáticamente por reglas al crear o editar. La última consulta de km toma la lectura más reciente (consulta, línea temporal, ODS, cita o cotización).',button('+ Vehículo','editVehicle()',true))+`<div class="panel">${table(['Acciones','Placa','Marca','Modelo','Año','Cliente','Grupo','Plan','Última consulta de km','ODS'],db.vehicles.filter(v=>!v.deleted).map(v=>[r73Act(r73Btn('edit','Editar / transferir',`editVehicle('${v.id}')`),r73Btn('del','Eliminar',`r73DelVehicle('${v.id}')`,'r73-red'),r73Btn('⏱','Registrar consulta de km',`r74KmConsult('${v.id}','Vehículo')`),r73Btn('↗','Línea temporal',`timelineVehicle='${v.id}';simKm=null;go('timeline')`)),`<b>${esc(v.plate)}</b>`,esc(v.brand),esc(v.model),esc(v.year),esc(client(v.client).name||'—'),v.group?`<span class="pill">${esc(v.group)}</span>`:'<span class="pill orange">Sin grupo</span>',v.plan?`<span class="pill">${esc(v.plan)}</span>`:'<span class="pill orange">Sin plan</span>',r75KmCell(v),db.orders.filter(o=>o.vehicle===v.id).length]))}</div>`;

const r75QuoteBase=r73OpenQuote;
r73OpenQuote=function(id){r75QuoteBase(id);const q=r73Quote(id),ft=$('modalbody').querySelector('footer');if(!q||!ft||$('modalbody').querySelector('.r75-qkm'))return;const v=r73QVehicle(q);if(!v)return;ft.insertAdjacentHTML('beforebegin',`<div class="r75-qkm"><label>Km informado por el cliente<input type="number" min="0" id="r75qkm" value="${q.km||''}"></label>${button('Guardar km',`r75QuoteKm('${q.id}')`)}${q.km?`<small>${(+q.km).toLocaleString('es-PE')} km · ${esc(new Date(q.kmAt||Date.now()).toLocaleString('es-PE'))}</small>`:''}</div>`)};
function r75QuoteKm(id){const q=r73Quote(id),km=+$('r75qkm').value;if(!(km>0))return toast('Escribe el kilometraje.');q.km=km;q.kmAt=new Date().toISOString();const v=vehicle(r73QVehicle(q));if(v)v.km=Math.max(+v.km||0,km);R73.lastText='Km informado en la cotización '+q.code+': '+km+' km';save('Km en cotización',q.code);r73OpenQuote(id)}


/* --------------------------------------------------------------------------
   Métricas (reemplaza al Resumen): Principal, General, Ventas y Satisfacción
   del cliente, con las fórmulas de la documentación de Tuulapp. Cada gráfico
   se descarga en SVG, PNG o CSV (2 columnas).
   -------------------------------------------------------------------------- */
const R75M={tab:'principal',from:null,to:null,pareto:null,charts:{}};
function r75MetCfg(){return db.settings.metrics??={hh:30,capacity:160,breakeven:4500}}
function r75Shift(ym,n){const d=new Date(ym+'-15T12:00:00');d.setMonth(d.getMonth()+n);return d.toLocaleDateString('en-CA').slice(0,7)}
function r75Range(){if(!R75M.to){R75M.to=today().slice(0,7);R75M.from=r75Shift(R75M.to,-11)}const out=[];for(let m=R75M.from,i=0;m<=R75M.to&&i<36;m=r75Shift(m,1),i++)out.push(m);return out}
function r75Day(iso){return String(iso||'').length>10?new Date(iso).toLocaleDateString('en-CA'):String(iso||'')}
function r75IsExt(l){if(l.external)return true;if(l.type!=='servicio')return false;const c=db.catalog.find(x=>x.id===l.catalog)||db.catalog.find(x=>x.code&&x.code===l.code),k=c&&(db.r74cats||[]).find(k=>k.id===c.category);return /extern|tercer/i.test(k?.name||'')}
function r75OrderAgg(o){const a={labor:0,parts:0,ext:0,partsCost:0,extCost:0};(o.lines||[]).forEach(l=>{const t=r72LineTotal(l)||0,c=r72LineCost(l)||0;if(l.type==='servicio'){if(r75IsExt(l)){a.ext+=t;a.extCost+=c}else a.labor+=t}else{a.parts+=t;a.partsCost+=c}});return a}
function r75Surveys(){const last={};(db.r74surveys||[]).filter(s=>!s.deleted).sort((a,b)=>a.at.localeCompare(b.at)).forEach(s=>{last[s.order]=s});return Object.values(last).map(s=>({ym:r75Day(s.at).slice(0,7),nps:+s.answers.nps||null,a:s.answers}))}
function r75Nps(list){const r=list.filter(x=>x.nps);if(!r.length)return null;const p=r.filter(x=>x.nps>=9).length,d=r.filter(x=>x.nps<=6).length;return Math.round((p-d)/r.length*100)}
function r75Series(months){const cfg=r75MetCfg(),S={};months.forEach(m=>S[m]={opened:0,arch:0,labor:0,parts:0,ext:0,partsCost:0,extCost:0,warranty:0,hours:0,hoursN:0});
  db.orders.filter(o=>!o.deleted).forEach(o=>{const mo=String(o.date||'').slice(0,7);if(S[mo]){S[mo].opened++;if(o.attentionType==='Garantía')S[mo].warranty++}
    if(o.state==='Archivada'&&o.closed){const mc=r75Day(o.closed).slice(0,7);if(!S[mc])return;const g=r75OrderAgg(o),s=S[mc];s.arch++;['labor','parts','ext','partsCost','extCost'].forEach(k=>s[k]+=g[k]);if(String(o.closed).length>10){const h=(new Date(o.closed)-new Date((o.date||'')+'T'+(o.time||'08:00')))/36e5;if(h>=0){s.hours+=h;s.hoursN++}}}});
  months.forEach(m=>{const s=S[m];s.hh=cfg.hh>0?s.labor/cfg.hh:0;s.util=cfg.capacity>0?s.hh/cfg.capacity*100:0;s.ticket=s.arch?s.labor/s.arch:0;s.gar=s.opened?s.warranty/s.opened*100:0;s.perm=s.hoursN?s.hours/s.hoursN:0;s.sales=s.labor+s.parts+s.ext;s.profParts=s.parts-s.partsCost;s.rentParts=s.parts?s.profParts/s.parts*100:0;s.profExt=s.ext-s.extCost});return S}
/* ---- gráficos SVG (barras con valor sobre cada barra) ---- */
const R75_FMT={money:v=>'S/ '+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),int:v=>String(Math.round(v)),pct:v=>v.toFixed(2)+'%',h1:v=>v.toLocaleString('en-US',{maximumFractionDigits:1}),nps:v=>String(Math.round(v))};
const R75_COL={blue:'#3b8bd6',yellow:'#d4a82c',green:'#2fb36d',red:'#d9534f',gray:'#8a9aa0',orange:'#d9822b'};
function r75Svg(c,t){const W=720,H=236,L=14,R=14,T=26,B=36,vals=c.pts.map(p=>p[1]).filter(v=>v!=null),min=Math.min(0,...vals,0),max0=Math.max(0,...vals,0),max=max0===min?min+1:max0,top=T,bot=H-B,y=v=>bot-(v-min)/(max-min)*(bot-top),slot=(W-L-R)/Math.max(1,c.pts.length),bw=Math.min(54,slot*.62),f=R75_FMT[c.fmt]||R75_FMT.int;
  const grid=[0,1,2,3].map(i=>{const gy=top+(bot-top)*i/3;return `<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" style="stroke:${t.grid}" stroke-width="1"/>`}).join('');
  const bars=c.pts.map(([lab,v],i)=>{const cx=L+slot*i+slot/2,x=cx-bw/2;let g='';if(v==null)g=`<text x="${cx}" y="${y(0)-6}" text-anchor="middle" font-size="10" style="fill:${t.mut}">s/d</text>`;else{const y0=y(0),y1=y(v),yy=Math.min(y0,y1),hh=Math.max(1.5,Math.abs(y0-y1));g=`<rect x="${x}" y="${yy}" width="${bw}" height="${hh}" rx="3" fill="${c.color}"><title>${esc(lab)}: ${esc(f(v))}</title></rect><text x="${cx}" y="${v>=0?yy-5:yy+hh+12}" text-anchor="middle" font-size="10.5" style="fill:${t.ink}">${esc(f(v))}</text>`}return g+`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="10.5" style="fill:${t.mut}">${esc(String(lab).replace(/^20(\d\d)-(\d\d)$/,'$2/$1'))}</text>`}).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Inter,system-ui,sans-serif" role="img" aria-label="${esc(c.title)}">${grid}<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" style="stroke:${t.mut}" stroke-width="1"/>${bars}</svg>`}
const R75_TOK={ink:'var(--ink)',mut:'var(--mut)',grid:'var(--line)'};
function r75Chart(id,title,help,pts,fmt,color,extra=''){const c=R75M.charts[id]={id,title,pts,fmt,color};const empty=pts.every(p=>!p[1]);
  return `<section class="r75-ch"><header><b>${esc(title)}</b><span class="r75-help" title="${esc(help)}">?</span><button type="button" class="r75-menu" aria-label="Descargar gráfico" title="Descargar" onclick="r75Menu(this)">≡</button><div class="r75-dd" hidden><button type="button" onclick="r75Dl('${id}','svg')">Descargar SVG</button><button type="button" onclick="r75Dl('${id}','png')">Descargar PNG</button><button type="button" onclick="r75Dl('${id}','csv')">Descargar CSV</button></div></header><div class="r75-svg ${empty?'dim':''}">${r75Svg(c,R75_TOK)}</div>${extra}</section>`}
function r75Menu(b){const dd=b.nextElementSibling,was=dd.hidden;document.querySelectorAll('.r75-dd').forEach(x=>x.hidden=true);dd.hidden=!was}
