function openOrder(id,customer=false){const o=db.orders.find(o=>o.id===id);modal(`<div class="row spread"><h2>${esc(o.code)} · ${esc(o.state)}</h2><span class="pill">${esc(vehicle(o.vehicle).plate)}</span></div><p>${esc(client(vehicle(o.vehicle).client).name)} · ${esc(o.date)} · Salida: ${esc(o.closed)||'Sin registrar'}</p>${table(customer?['Descripción','Cantidad','Venta']:['Descripción','Técnico','Horas','Costo','Venta','Acción'],o.lines.map(l=>customer?[esc(l.name),l.qty,money(l.price)]:[esc(l.name)+`<small>${esc(l.type)}</small>`,esc(tech(l.tech)),l.hours??'—',money(l.cost),money(l.price),o.state==='Archivada'?'Bloqueado':button('Editar',`closeModal();editLine('${id}','${l.id}')`)]))}<h2 class="space">Total: ${money(total(o))}</h2><p class="sub">Documento informativo de demostración. No es comprobante tributario. ${customer?'Vista cliente: costos ocultos.':''}</p><footer>${button('Cerrar','closeModal()')}${button('Imprimir / PDF','window.print()')}${!customer?button('Vista cliente',`closeModal();openOrder('${id}',true)`):''}${o.state!=='Archivada'&&!customer?button('+ Ítem',`closeModal();editLine('${id}')`)+button('Avanzar proceso',`advanceOrder('${id}')`,true):''}${o.state==='Archivada'&&!customer?button('Reabrir con motivo',`closeModal();reopen('${id}')`):''}</footer>`)}
function editLine(orderId,lineId){const o=db.orders.find(x=>x.id===orderId),l=o.lines.find(x=>x.id===lineId)||{};if(o.state==='Archivada')return toast('Reabre la ODS antes de editar en esta demo.');form('Detalle de orden',field('name','Descripción',l.name,'text','required')+select('type','Tipo',[['servicio','Servicio / mano de obra'],['producto','Producto comprado para ODS']],l.type)+select('tech','Técnico',techOpts(),l.tech||o.tech)+field('hours','Horas (servicio)',l.hours??0.5,'number','min="0.25" step="0.25" required')+field('qty','Cantidad',l.qty||1,'number','min="0.01" step="0.01" required')+field('cost','Costo unitario',l.cost??0,'number','min="0" step="0.01" required')+field('price','Venta unitaria',l.price??0,'number','min="0" step="0.01" required'),d=>{for(const k of ['qty','cost','price','hours'])d[k]=+d[k];if(lineId)Object.assign(l,d);else o.lines.push({id:uid(),...d});save('Detalle actualizado',o.code+' · '+d.name)})}
function workdays(date,n){let d=new Date(date+'T12:00:00');while(n){d.setDate(d.getDate()+1);if(d.getDay()!==0)n--}return d.toLocaleDateString('en-CA')}
function advanceOrder(id){const o=db.orders.find(x=>x.id===id);if(o.state==='Entrega'&&!o.lines.some(l=>l.type==='servicio'))return toast('Se necesita al menos un servicio.');o.state=states[Math.min(states.indexOf(o.state)+1,3)];if(o.state==='Archivada'){o.closed=o.keepExit||new Date().toISOString();if(!db.tasks.some(t=>t.order===id)){db.tasks.push({id:uid(),title:'Seguimiento de '+o.code,owner:'u-caja',due:workdays(today(),5),state:'Pendiente',order:id,notes:[]})}}save('Cambio de proceso',o.code+' → '+o.state);closeModal();odsState=o.state;render()}

function calendar(items){const [y,m]=month.split('-').map(Number),n=new Date(y,m,0).getDate(),offset=(new Date(y,m-1,1).getDay()+6)%7;return `<div class="calendar">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div style="padding:8px;text-align:center">${d}</div>`).join('')}${Array.from({length:offset},()=>'<div class="day"></div>').join('')}${Array.from({length:n},(_,i)=>{const d=month+'-'+String(i+1).padStart(2,'0');return `<div class="day"><b>${i+1}</b>${items.filter(x=>x.date===d).map(x=>button(esc(x.title),x.action)).join('')}</div>`}).join('')}</div>`}
function editTask(id){const t=db.tasks.find(x=>x.id===id)||{};form('Tarea de posventa',field('title','Título',t.title,'text','required')+field('due','Vencimiento',t.due||today(),'date','required')+select('owner','Responsable',db.users.filter(u=>u.role!=='Técnico').map(u=>[u.id,u.name]),t.owner||'u-caja')+select('state','Estado',['Pendiente','En seguimiento','Cita generada','Completada'].map(s=>[s,s]),t.state)+field('note','Resultado / nota')+`<div class="wide sub">${(t.notes||[]).map(esc).join('<br>')}</div>`+(id?`<div class="wide row">${button('Registrar intento WhatsApp',`contact('${id}')`)}${button('Crear cita',`closeModal();newAppointment('${id}')`)}${button('Nueva subtarea',`closeModal();editTask()` )}</div>`:''),d=>{const note=d.note;delete d.note;if(id){Object.assign(t,d);if(note)t.notes.push(new Date().toLocaleString()+' · '+note)}else db.tasks.push({id:uid(),...d,notes:note?[note]:[]});save('Tarea guardada',d.title)})}
function contact(id){const t=db.tasks.find(x=>x.id===id),phone=(db.clients[0].phone||'').replace(/\D/g,'');if(!phone||phone.length<9)return toast('Primero completa el teléfono del cliente. No se abrió WhatsApp.');const message='Hola, le contactamos de R Motriz para dar seguimiento a su vehículo. ¿Podemos coordinar una atención?';window.open('https://wa.me/'+(phone.length===9?'51':'')+phone+'?text='+encodeURIComponent(message),'_blank','noopener');t.notes.push('Apertura de WhatsApp; envío y respuesta no confirmados');save('Intento de contacto',t.title);toast('Registra manualmente el resultado. Abrir no confirma envío.')}
views.citas=()=>heading('Citas','Reservas vinculadas a servicios y técnicos. La llegada se convierte en ODS.',button('+ Agendar cita','newAppointment()',true))+`<div class="panel">${table(['Cliente / vehículo','Fecha','Servicios','Estado','Acciones'],db.appointments.map(a=>[esc(vehicle(a.vehicle).plate),esc(a.date)+' '+esc(a.time),a.services.map(s=>esc(s.name)+' · '+esc(tech(s.tech))).join('<br>'),`<span class="pill">${a.order?'En taller':esc(a.state)}</span>`,a.order?button('Ver ODS',`openOrder('${a.order}')`):button('+ Servicio',`appointmentService('${a.id}')`)+button('Llegó → ODS',`arrive('${a.id}')`)+button('Reprogramar',`reschedule('${a.id}')`)]))}</div><h2 class="space">Calendario de citas</h2><input type="month" aria-label="Mes de citas" value="${month}" onchange="month=this.value;render()"><div class="space">${calendar(db.appointments.map(a=>({title:vehicle(a.vehicle).plate+' · '+a.time,date:a.date,action:`toast('Estado: ${a.order?'En taller':a.state}')` })))}</div>`;
function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function canBook(techId,date,start,hours,ignore){const end=start+hours*60;if(start<360||end>1380||hours<=0||Math.round(hours*4)!==hours*4||start%15!==0)return false;if(start<db.settings.lunchEnd*60&&end>db.settings.lunchStart*60)return false;const list=db.blocks.filter(b=>b.tech===techId&&b.date===date&&b.id!==ignore);const events=[[start,1],[end,-1]];for(const b of list){events.push([b.start,1],[b.start+b.hours*60,-1])}events.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let n=0;return events.every(e=>(n+=e[1])<=2)}
function newAppointment(task){form('Nueva cita',select('vehicle','Vehículo',db.vehicles.map(v=>[v.id,v.plate]))+field('date','Día',today(),'date','required')+field('time','Hora','08:00','time','required step="900"')+select('tech','Técnico responsable',techOpts())+field('service','Servicio previsto','','text','required')+field('hours','Duración estimada',1,'number','min="0.25" step="0.25" required'),d=>{if(!canBook(d.tech,d.date,minutes(d.time),+d.hours)){toast('Reserva rechazada: descanso o tercera superposición.');return false}const a={id:uid(),vehicle:d.vehicle,date:d.date,time:d.time,tech:d.tech,state:'Confirmada',task,services:[{id:uid(),name:d.service,tech:d.tech,hours:+d.hours}]};db.appointments.push(a);db.blocks.push({id:uid(),appointment:a.id,service:a.services[0].id,date:d.date,start:minutes(d.time),hours:+d.hours,tech:d.tech,name:d.service,note:'Reserva de cita'});if(task){const t=db.tasks.find(t=>t.id===task);t.state='Cita generada'}save('Cita creada',d.date+' '+d.time)})}
function appointmentService(id){const a=db.appointments.find(a=>a.id===id);form('Otro servicio de la misma cita',field('name','Servicio','','text','required')+select('tech','Técnico',techOpts(),a.tech)+field('time','Hora',a.time,'time','required')+field('hours','Horas',0.5,'number','min="0.25" step="0.25" required'),d=>{if(!canBook(d.tech,a.date,minutes(d.time),+d.hours)){toast('No hay capacidad para este bloque.');return false}const s={id:uid(),name:d.name,tech:d.tech,hours:+d.hours};a.services.push(s);db.blocks.push({id:uid(),appointment:id,service:s.id,date:a.date,start:minutes(d.time),hours:s.hours,tech:s.tech,name:s.name});save('Servicio añadido a cita',s.name)})}

openOrder=function(id,customer=false){const o=db.orders.find(o=>o.id===id);modal(`<div class="row spread"><h2>ODS #${esc(o.code)} · ${esc(o.state)}</h2><b>${esc(vehicle(o.vehicle).plate)}</b></div><p>${esc(client(vehicle(o.vehicle).client).name)} · Ingreso ${esc(o.date)} · Salida ${esc(o.closed)||'Sin registrar'}</p>${table(customer?['Ítem','Cant. / H-H','Precio unitario / H-H','Importe']:['Ítem','Técnico','Cant. / H-H','Tiempo revisado','Costo unitario','Venta unitaria / H-H','Importe',''],o.lines.map(l=>{const q=quantityHH(l),qty=(q==null?'Sin dato':q)+`<small>${l.type==='servicio'?'H-H presupuestadas':'Unidades'}</small>`;return customer?[esc(l.name),qty,money(l.price),money(lineAmount(l))]:[esc(l.name)+`<small>${esc(l.type)}</small>`,esc(tech(l.tech)),qty,l.type==='servicio'?(l.revised??l.hours??'Sin dato')+' h':'—',money(l.cost),money(l.price),money(lineAmount(l)),o.state==='Archivada'?'Bloqueado':button('Editar',`closeModal();editLine('${id}','${l.id}')`)]}))}<h2 class="space">Total: ${money(orderTotal(o))}</h2><p class="sub">Cant. / H-H = unidades de productos u horas presupuestadas de servicios. Ampliar tiempo operativo no cambia cantidad comercial ni precio. Los datos históricos desconocidos no se estiman.</p><footer>${button('Cerrar','closeModal()')}${button('Imprimir / PDF','window.print()')}${!customer?button('Vista cliente',`closeModal();openOrder('${id}',true)`):''}${o.state!=='Archivada'&&!customer?button('+ Ítem',`closeModal();editLine('${id}')`)+button('Avanzar proceso',`advanceOrder('${id}')`,true):''}${o.state==='Archivada'&&!customer?button('Reabrir con motivo',`closeModal();reopen('${id}')`):''}</footer>`)};
editLine=function(orderId,lineId){const o=db.orders.find(x=>x.id===orderId),l=o.lines.find(x=>x.id===lineId)||{};if(o.state==='Archivada')return toast('Reabre la ODS antes de editar.');if(db.notes.some(n=>n.order===orderId))return toast('Nota emitida: falta implementar el ajuste documental para cambiar importes.');form('Ítem · cantidad o H-H',field('name','Descripción',l.name,'text','required')+select('type','Tipo',[['servicio','Servicio / mano de obra'],['producto','Producto por ODS']],l.type)+select('tech','Técnico del servicio',techOpts(),l.tech||o.tech)+field('quantity','Cant. / H-H',quantityHH(l)??1,'number','min="0.01" step="0.01" required')+field('cost','Costo por unidad / H-H',l.cost??0,'number','min="0" step="0.01" required')+field('price','Precio por unidad / H-H',l.price??0,'number','min="0" step="0.01" required')+`<p class="wide sub">Servicio: 3 = 3 H-H, pasos de 0.5. Producto: 3 = 3 unidades. Importe = cantidad × precio por unidad/H-H.</p>`,d=>{const q=+d.quantity;if(d.type==='servicio'&&(q<0.25||Math.round(q*4)!==q*4)){toast('Las H-H deben avanzar en pasos de 0.25.');return false}const before=JSON.stringify(l),changes={name:d.name,type:d.type,tech:d.type==='servicio'?d.tech:null,qty:q,hours:d.type==='servicio'?q:null,price:+d.price,cost:+d.cost};if(lineId)Object.assign(l,changes);else o.lines.push({id:uid(),...changes});save('Detalle actualizado',o.code+' · antes '+before+' · después '+JSON.stringify(changes))})};

function filteredReportOrders(){return db.orders.filter(o=>{const d=reportBasis==='Salida'?(o.closed||'').slice(0,10):o.date;return d&&(!reportFrom||d>=reportFrom)&&(!reportTo||d<=reportTo)})}
function reportData(){const orders=filteredReportOrders();if(reportKind==='Operaciones')return {headers:['Ingreso','Salida','Estado','ODS','Placa','Técnico','Tipo','Ítem','Cant. / H-H','Importe'],rows:orders.flatMap(o=>o.lines.map(l=>[o.date,(o.closed||'').slice(0,10),o.state,o.code,vehicle(o.vehicle).plate,tech(l.tech),l.type,l.name,quantityHH(l)??'Sin dato',lineAmount(l)??'Sin dato']))};if(reportKind==='Técnicos')return {headers:['Ingreso','Salida','ODS','Placa','Técnico','Servicio','H-H iniciales','Horas revisadas','Venta servicio'],rows:orders.flatMap(o=>o.lines.filter(l=>l.type==='servicio'&&(!reportTech||l.tech===reportTech)).map(l=>[o.date,(o.closed||'').slice(0,10),o.code,vehicle(o.vehicle).plate,tech(l.tech),l.name,l.hours??'Sin dato',l.revised??l.hours??'Sin dato',lineAmount(l)??'Sin dato']))};if(reportKind==='Rentabilidad')return {headers:['ODS','Tipo','Ítem','Cant. / H-H','Costo total','Venta','Ganancia bruta','Margen %'],rows:orders.flatMap(o=>o.lines.map(l=>{const q=quantityHH(l),c=l.cost==null||q==null?null:l.cost*q,v=lineAmount(l);return [o.code,l.type,l.name,q??'Sin dato',c??'Sin dato',v??'Sin dato',c==null||v==null?'Sin dato':+(v-c).toFixed(2),c==null||v==null||v===0?'No aplica':+((v-c)/v*100).toFixed(2)]}))};if(reportKind==='Ventas por ítem')return {headers:['ODS','Documento interno','Placa','Ítem','Cant. / H-H','Total'],rows:orders.filter(o=>db.notes.some(n=>n.order===o.id)).flatMap(o=>o.lines.map(l=>[o.code,db.notes.find(n=>n.order===o.id).code,vehicle(o.vehicle).plate,l.name,quantityHH(l)??'Sin dato',lineAmount(l)??'Sin dato']))};return {headers:['ODS','Nota interna','Total','Abonos','Saldo'],rows:orders.filter(o=>db.notes.some(n=>n.order===o.id)).map(o=>{const n=db.notes.find(n=>n.order===o.id);return [o.code,n.code,n.total,paid(o),+(n.total-paid(o)).toFixed(2)]})}}
views.reportes=()=>{const r=reportData();return heading('Reportes operativos','Estructuras de Tuulapp; resultados calculados solo con datos locales.',button('Descargar CSV','exportReport()',true)+button('Imprimir / PDF','window.print()'))+`<div class="tabs">${['Operaciones','Técnicos','Rentabilidad','Ventas por ítem','Ventas y saldos'].map(k=>`<button class="${reportKind===k?'selected':''}" onclick="reportKind='${k}';render()">${k}</button>`).join('')}</div><div class="filterbar"><label>Base de fecha<select onchange="reportBasis=this.value;render()"><option ${reportBasis==='Ingreso'?'selected':''}>Ingreso</option><option ${reportBasis==='Salida'?'selected':''}>Salida</option></select></label><label>Desde<input type="date" value="${reportFrom}" onchange="reportFrom=this.value;render()"></label><label>Hasta<input type="date" value="${reportTo}" onchange="reportTo=this.value;render()"></label><label>Técnico (reporte técnicos)<select onchange="reportTech=this.value;render()"><option value="">Todos</option>${techOpts().map(([id,n])=>`<option value="${id}" ${reportTech===id?'selected':''}>${esc(n)}</option>`).join('')}</select></label></div><div class="panel space"><h2>${reportKind} · ${r.rows.length} filas</h2>${table(r.headers,r.rows.map(row=>row.map(esc)))}</div><p class="sub">CSV compatible con Excel, no XLSX. No se importó el backup ni se calcularon impuestos. Horas de servicio, estadía y horas reales son magnitudes distintas.</p><div class="panel space"><h2>Metas de posventa</h2><p>Tareas: ${db.goals.tasks} · Citas: ${db.goals.appointments} · Retornos: ${db.goals.returns}</p>${button('Editar metas','editGoals()')}</div>`};
function exportReport(){const r=reportData(),safe=v=>{let s=String(v??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'},csv='\ufeff'+[r.headers,...r.rows].map(row=>row.map(safe).join(';')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='RMotriz_'+reportKind.replaceAll(' ','_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function nextRecurrence(t){if(t.state!=='Completada'||!t.recurrence||t.nextId)return;const d=new Date(t.due+'T12:00:00');d.setDate(d.getDate()+t.recurrence);const n={...t,id:uid(),due:d.toLocaleDateString('en-CA'),state:'Pendiente',notes:[],nextId:null,previous:t.id};t.nextId=n.id;db.tasks.push(n)}

function blockEnd(b){return workSegments(b.start,b.hours).at(-1)?.[1]??b.start}
function validSlot(techId,date,start,hours,ignore){const seg=workSegments(start,hours);if(!techId||!date||!seg.length||start<480||start%30!==0||blockEnd({start,hours})>1200)return false;const points=seg.flatMap(([a,b])=>[[a,1],[b,-1]]);for(const b of db.blocks.filter(b=>b.tech===techId&&b.date===date&&b.id!==ignore))points.push(...workSegments(b.start,b.hours).flatMap(([a,z])=>[[a,1],[z,-1]]));points.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let n=0;return points.every(p=>(n+=p[1])<=2)}

views.timeline=()=>{const m=timelineModel(),v=m.v,current=simKm??m.estimate;return heading('Línea temporal','Historial, meses y kilometraje en una sola matriz',button('Imprimir / PDF','window.print()'))+`<div class="filterbar"><label>Vehículo<select onchange="timelineVehicle=this.value;simKm=null;render()">${db.vehicles.map(v=>`<option value="${v.id}" ${v.id===timelineVehicle?'selected':''}>${esc(v.plate+' · '+v.model)}</option>`).join('')}</select></label><label>Uso<select onchange="vehicle(timelineVehicle).use=this.value;save('Uso simulado',timelineVehicle)"><option value="S" ${v.use==='S'?'selected':''}>Severo</option><option value="P" ${v.use==='P'?'selected':''}>Particular</option></select></label><label>Aceite<select onchange="vehicle(timelineVehicle).oil=this.value;save('Aceite elegido',timelineVehicle)">${['','Mineral','Semisintético','Sintético','Full sintético'].map(s=>`<option ${s===(v.oil||'')?'selected':''} value="${s}">${s||'Sin seleccionar'}</option>`).join('')}</select></label><label>Estimación km/mes<input type="number" min="0" max="15000" value="${m.rate}" onchange="setKmRate(this.value)"></label></div>
<div class="grid space"><div class="panel"><small>Último ingreso con km</small><h2>${m.last?.km?.toLocaleString('es-PE')||'Sin lectura'} km</h2><p>${esc(m.last?.date)} · ODS ${esc(m.last?.code)}</p></div><div class="panel"><small>Hoy estimado, no lectura real</small><h2>${m.estimate?.toLocaleString('es-PE')} km</h2><p>Tasa editable de simulación · ${today()}</p></div><div class="panel"><small>Simulación</small><h2>${Math.round(current).toLocaleString('es-PE')} km</h2><input aria-label="Simular kilometraje" type="range" min="${m.bins[0]}" max="${m.bins.at(-1)}" step="500" value="${current}" onchange="simKm=+this.value;render()">${button('Restablecer','simKm=null;render()')}</div><div class="panel"><small>Plan explícito del vehículo</small><h2>${esc(m.plan?.id||'Sin plan')}</h2><p>Reglas no aprobadas técnicamente.</p></div></div>
<p class="banner">Aceite: mineral/semisintético 5.000 km; sintético/full sintético 7.500 km, propuesta del usuario pendiente de validación. Los demás intervalos conservan su regla. No se convierten reparaciones ni productos en evidencia de cambio de aceite.</p><p>✓ Registrado · ! Vencido (solo el primer pendiente; km o tiempo, lo que ocurra primero) · ◇ Programado · ○ Condicional (presupone atender el anterior) · ? Sin registro · — Sin intervalo documentado</p>${timelineMatrix(m,current)}`};
function setKmRate(value){const rate=+value;if(!Number.isFinite(rate)||rate<0||rate>15000)return toast('Tasa entre 0 y 15.000');db.timelineSettings[timelineVehicle]={rate};simKm=null;save('Tasa de simulación',timelineVehicle+' '+rate)}
function timelineMatrix(m,current){if(!m.plan)return '<div class="panel">Vehículo sin plan explícito: no se genera proyección.</div>';const cls=k=>[k===binKm(m.last?.km)?'lastcol':'',k===binKm(current)?'simcol':''].join(' '),monthLabel=k=>{const known=m.hist.find(o=>o.km!=null&&binKm(o.km)===k);if(known)return known.date.slice(0,7)+' · registro';if(!m.last||!m.rate)return 'Mes sin estimar';return new Date(new Date(m.last.date+'T12:00:00').getTime()+(k-m.last.km)/m.rate*30.4375*86400000).toLocaleDateString('es-PE',{month:'short',year:'numeric'})+' · est.'};
return `<div class="tl-scroll"><table class="tlmatrix"><thead><tr><th class="tlservice">Actividad / categoría</th>${m.bins.map(k=>`<th class="${cls(k)}">${k.toLocaleString('es-PE')} km<small>${monthLabel(k)}</small>${k===binKm(m.last?.km)?'<small>Último registro</small>':''}${k===binKm(current)?'<small>Simulación actual</small>':''}</th>`).join('')}<th>Sin kilometraje</th></tr></thead><tbody>${m.plan.rules.map(r=>`<tr><td class="tlservice"><b>${esc(r.n)}</b><small>${esc(r.category||r.cat||'Mantenimiento preventivo')}</small><small>${tlRuleLabel(r,m)}</small></td>${m.bins.map(k=>`<td class="${cls(k)}">${timelineCell(r,m,k)}</td>`).join('')}<td>${m.hist.filter(o=>o.km==null&&o.lines.some(l=>ruleMatches(r,l))).map(o=>button('✓ '+esc(o.date),`openOrder('${o.id}')`)).join('')}</td></tr>`).join('')}<tr class="ods-band"><td class="tlservice"><b>ODS reales</b><small>Mismas columnas; fechas originales.</small></td>${m.bins.map(k=>`<td class="${cls(k)}">${m.hist.filter(o=>o.km!=null&&binKm(o.km)===k).map(o=>`<button class="ods-chip" onclick="openOrder('${o.id}')"><b>#${esc(o.code)}</b><small>${o.date}<br>${o.km.toLocaleString('es-PE')} km</small></button>`).join('')}</td>`).join('')}<td>${m.hist.filter(o=>o.km==null).map(o=>button('#'+esc(o.code)+' · '+o.date,`openOrder('${o.id}')`)).join('')}</td></tr></tbody></table></div><p class="sub">Cada columna incluye desde su km hasta el siguiente (límite superior excluido). Mes estimado ≠ fecha real. Los eventos conservan su umbral exacto. Sin km se conserva la fecha por separado.</p>`}

function timelineCategory(r){const n=normal(r.n);if(/aceite|motor|bujia|correa|distribucion/.test(n))return 'Motor y lubricación';if(/freno|neumatic|suspension|direccion/.test(n))return 'Seguridad y rodaje';if(/caja|transmision|embrague/.test(n))return 'Transmisión';if(/cabina|aire|ventilacion/.test(n))return 'Confort';return 'Mantenimiento general'}
const timelineMatrixR4=timelineMatrix;
timelineMatrix=function(m,current){let s=timelineMatrixR4(m,current);s=s.replace(/<td class="(lastcol|simcol|lastcol simcol| |lastcol | simcol|)">([\s\S]*?)<\/td>/g,(all,c,body)=>`<td class="${c}"><div class="tlcell">${body}</div></td>`);s=s.replace(/<td>([\s\S]*?)<\/td>/g,(all,body)=>`<td><div class="tlcell">${body}</div></td>`);return s};

function scheduleFor(date){const day=new Date(date+'T12:00:00').getDay();return db.settings.weekSchedule[day]||db.settings.weekSchedule[1]}
function scheduleLabel(s){return s.open?`${timeText(s.start*60)}–${timeText(s.end*60)} · almuerzo ${timeText(s.lunchStart*60)}–${timeText(s.lunchEnd*60)}`:'Archivada'}
function editWeeklySchedule(){const names=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];const html=names.map((name,i)=>{const s=db.settings.weekSchedule[i];return `<fieldset class="daycfg"><legend>${name}</legend><label class="check"><input name="open_${i}" type="checkbox" ${s.open?'checked':''}>Abierto</label>${field('start_'+i,'Inicio',timeText(s.start*60),'time','step="900"')}${field('end_'+i,'Fin',timeText(s.end*60),'time','step="900"')}${field('lunchStart_'+i,'Almuerzo desde',timeText(s.lunchStart*60),'time','step="900"')}${field('lunchEnd_'+i,'Almuerzo hasta',timeText(s.lunchEnd*60),'time','step="900"')}</fieldset>`}).join('');form('Horario semanal y almuerzo',html,d=>{for(let i=0;i<7;i++){const start=minutes(d['start_'+i]),end=minutes(d['end_'+i]),a=minutes(d['lunchStart_'+i]),z=minutes(d['lunchEnd_'+i]);if(end<=start||z-a!==60||a<start||z>end)throw Error('Cada día requiere jornada válida y exactamente una hora de almuerzo.');db.settings.weekSchedule[i]={open:!!document.querySelector('[name="open_'+i+'"]').checked,start:start/60,end:end/60,lunchStart:a/60,lunchEnd:z/60}}save('Horario semanal actualizado','Horario configurable')})}
function editReminderSettings(){form('Reglas de agenda y recordatorios',field('appointmentMinLeadHours','Anticipación mínima para contar como cita (horas)',db.settings.appointmentMinLeadHours,'number','min="0.5" max="24" step="0.5" required')+field('confirmationLeadMinutes','Recordar confirmación antes (minutos)',db.settings.confirmationLeadMinutes,'number','min="30" max="1440" step="30" required'),d=>{db.settings.appointmentMinLeadHours=+d.appointmentMinLeadHours;db.settings.confirmationLeadMinutes=+d.confirmationLeadMinutes;save('Reglas de recordatorio actualizadas',JSON.stringify(d))})}

let selectedAgendaTech='';
function workSegments(start,hours,date=selectedDate){const s=scheduleFor(date);if(!s.open||!Number.isFinite(start)||!Number.isFinite(hours)||hours<=0||Math.round(hours*4)!==hours*4)return [];let cursor=start,left=hours*60,segments=[],a=s.lunchStart*60,z=s.lunchEnd*60;if(cursor>=a&&cursor<z)cursor=z;while(left>0){let end=cursor+left;if(cursor<a&&end>a)end=a;segments.push([cursor,end]);left-=end-cursor;cursor=end===a?z:end;if(cursor>s.end*60)return []}return segments}
blockEnd=function(b){return workSegments(b.start,b.hours,b.date||selectedDate).at(-1)?.[1]??b.start};
validSlot=function(techId,date,start,hours,ignore){const s=scheduleFor(date),seg=workSegments(start,hours,date);if(!s.open||!techId||!seg.length||start<s.start*60||start%15!==0||blockEnd({start,hours,date})>s.end*60)return false;const points=seg.flatMap(([a,b])=>[[a,1],[b,-1]]);for(const b of db.blocks.filter(b=>b.tech===techId&&b.date===date&&b.id!==ignore))points.push(...workSegments(b.start,b.hours,date).flatMap(([a,z])=>[[a,1],[z,-1]]));points.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let n=0;return points.every(p=>(n+=p[1])<=2)};
canBook=validSlot;
function agendaY(min,date){const s=scheduleFor(date),a=s.lunchStart*60,z=s.lunchEnd*60,base=s.start*60;if(min<=a)return (min-base)*1.2;if(min<=z)return (a-base)*1.2+(min-a)*.6;return (a-base)*1.2+(z-a)*.6+(min-z)*1.2}
function minuteAtAgendaY(y,date){const s=scheduleFor(date),a=s.lunchStart*60,z=s.lunchEnd*60,base=s.start*60,ya=(a-base)*1.2,yz=ya+(z-a)*.6;if(y<=ya)return base+Math.round(y/18)*15;if(y<=yz)return a+Math.round((y-ya)/9)*15;return z+Math.round((y-yz)/18)*15}
function agendaGrid(){const s=scheduleFor(selectedDate),all=agendaTechs(),techs=selectedAgendaTech?all.filter(([id])=>id===selectedAgendaTech):all;if(!s.open)return `<div class="panel">Taller cerrado el ${selectedDate}. Modifica el horario en Configuración.</div>`;const hours=Array.from({length:Math.floor(s.end-s.start)+1},(_,i)=>s.start+i);return `<div class="filterbar"><label>Técnico<select onchange="selectedAgendaTech=this.value;render()"><option value="">Todos</option>${all.map(([id,n])=>`<option value="${id}" ${id===selectedAgendaTech?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>Fecha<input type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()"></label>${actorUser()?.role==='Técnico'?button('+ Servicio express','newQuickWork()',true):button('+ Cita','newAppointmentR5()',true)}</div><p class="sub">${scheduleLabel(s)} · máximo dos servicios simultáneos. El almuerzo ocupa media franja visual, pero descuenta una hora efectiva.</p><div class="agenda-scroll"><div class="agenda-head" style="grid-template-columns:64px repeat(${techs.length},minmax(230px,1fr))"><b>Hora</b>${techs.map(([,n])=>`<b>${esc(n)}</b>`).join('')}</div><div class="agenda-body r5agenda" style="height:${agendaY(s.end*60,selectedDate)}px;grid-template-columns:64px repeat(${techs.length},minmax(230px,1fr))"><div class="time-axis">${hours.map(h=>`<span style="top:${agendaY(h*60,selectedDate)}px">${timeText(h*60)}</span>`).join('')}</div>${techs.map(([id])=>agendaColumn(id)).join('')}</div></div>${dayReviewPanel()}`}
agendaColumn=function(id){const s=scheduleFor(selectedDate),blocks=db.blocks.filter(b=>b.tech===id&&b.date===selectedDate).sort((a,b)=>a.start-b.start),ends=[0,0],now=new Date(),todayLine=selectedDate===today()?agendaY(now.getHours()*60+now.getMinutes(),selectedDate):null;return `<div class="tech-column r5col" data-tech="${id}" onclick="slotClickR5(event,'${id}')"><div class="lunch-band" style="top:${agendaY(s.lunchStart*60,selectedDate)}px;height:${agendaY(s.lunchEnd*60,selectedDate)-agendaY(s.lunchStart*60,selectedDate)}px">Almuerzo</div>${todayLine!=null?`<div class="now-line" style="top:${todayLine}px"><span>${timeText(now.getHours()*60+now.getMinutes())}</span></div>`:''}${blocks.map(b=>{let lane=ends.findIndex(e=>e<=b.start);if(lane<0)lane=0;ends[lane]=blockEnd(b);const v=blockVehicle(b),top=agendaY(b.start,b.date),height=Math.max(34,agendaY(blockEnd(b),b.date)-top);return `<div class="work-block" data-r5block="${b.id}" style="top:${top}px;height:${height}px;left:calc(${lane*50}% + 3px);width:calc(50% - 6px)"><div class="resize top" data-r5mode="start">═</div><div class="block-content" data-r5mode="move"><b>${esc(v.plate||'Express')} · ${esc(v.model||'')}</b><small>${esc(b.name)}</small><small>${timeText(b.start)}–${timeText(blockEnd(b))} · ${b.hours} H-H</small><span>${b.appointment?'Cita previa':b.express?'Servicio express':'Sin cita previa'}</span></div><div class="resize bottom" data-r5mode="end">═</div></div>`}).join('')}</div>`}

function cashActionR5(id){const b=db.cashBoxes.find(b=>b.id===id);if(b.open){const expected=b.initial+db.movements.slice(b.start).filter(m=>m.box===b.id&&m.method==='Efectivo').reduce((s,m)=>s+(m.type==='Ingreso'?m.amount:-m.amount),0);form('Cerrar '+b.name,field('declared','Efectivo contado',expected,'number','min="0" step="0.01" required'),d=>{b.open=false;b.closedAt=new Date().toISOString();b.declared=+d.declared;b.expected=expected;save('Cierre de caja',b.name+' diferencia '+(+d.declared-expected))})}else form('Abrir '+b.name,field('initial','Efectivo inicial',0,'number','min="0" step="0.01" required'),d=>{b.open=true;b.initial=+d.initial;b.start=db.movements.length;b.openedAt=new Date().toISOString();save('Apertura de caja',b.name)})}

function newNoteR5(orderId){const candidates=db.orders.filter(o=>(o.state==='Entrega'||o.state==='Archivada')&&total(o)!=null&&!db.notes.some(n=>n.order===o.id)),box=currentCashBox();if(!box)return modal(`<h2>Caja sin apertura</h2><p>Abre la caja asignada al usuario antes de emitir una nota de venta.</p><footer>${button('Ir a cajas',"closeModal();go('caja')",true)}${button('Cerrar','closeModal()')}</footer>`);if(!candidates.length)return toast('No hay ODS disponible para nota.');form('Nota de venta inmutable',select('order','ODS',candidates.map(o=>[o.id,o.code+' · '+money(total(o))]),orderId)+field('note','Observación','','text'),d=>{const o=db.orders.find(o=>o.id===d.order);db.notes.push({id:uid(),code:'NV-DEMO-'+String(db.notes.length+1).padStart(5,'0'),order:o.id,total:total(o),box:box.id,createdBy:actor,createdAt:new Date().toISOString(),observation:d.note,immutable:true});o.billing='Facturado';save('Nota de venta emitida',o.code)})}
newNote=newNoteR5;
function deleteNoteR5(id){const n=db.notes.find(n=>n.id===id);if(!n||!confirm('La nota se eliminará y se revertirán sus pagos y movimientos de caja. ¿Continuar?'))return;const paymentIds=db.payments.filter(p=>p.order===n.order).map(p=>p.id);db.payments=db.payments.filter(p=>p.order!==n.order);db.movements=db.movements.filter(m=>m.order!==n.order&&!paymentIds.includes(m.payment));db.notes=db.notes.filter(x=>x.id!==id);const o=db.orders.find(o=>o.id===n.order);if(o)o.billing='No facturado';save('Nota anulada y caja revertida',n.code)}
views.notas=()=>heading('Notas de venta','Documento interno inmutable; eliminar revierte pagos y caja.',button('+ Nota','newNoteR5()',true))+`<div class="panel">${table(['Código','ODS','Total','Caja','Estado',''],db.notes.map(n=>[esc(n.code),esc(db.orders.find(o=>o.id===n.order)?.code),money(n.total),esc(db.cashBoxes.find(b=>b.id===n.box)?.name||''),paid(db.orders.find(o=>o.id===n.order))>=n.total?'Cobrada':'Cuenta por cobrar',button('Eliminar y revertir',`deleteNoteR5('${n.id}')`)]))}</div>`;
newPayment=function(id){const n=db.notes.find(n=>n.order===id),o=db.orders.find(o=>o.id===id),box=currentCashBox();if(!n)return toast('Primero emite nota de venta.');if(!box)return toast('Abre tu caja asignada.');if(n.total-paid(o)<=0)return toast('Sin saldo pendiente.');form('Registrar pago',field('amount','Importe',n.total-paid(o),'number',`min="0.01" max="${n.total-paid(o)}" step="0.01" required`)+select('method','Medio',['Efectivo','Yape','Plin','Transferencia'].map(s=>[s,s]))+field('ref','Referencia'),d=>{const p={id:uid(),order:id,amount:+d.amount,method:d.method,date:today(),ref:d.ref,box:box.id};db.payments.push(p);db.movements.push({id:uid(),payment:p.id,order:id,box:box.id,date:today(),type:'Ingreso',amount:+d.amount,method:d.method,note:o.code});save('Pago registrado',o.code+' · '+d.amount)})};

let r6Filters=[],r6GroupBy='',r6FilterOpen=false,r6Selected=new Set(),r6PanelId=null,r6PanelTab='details',r6ReplyTo=null;

function r6TaskTypes(){return ['Tarea','Proyecto','Cita','Orden de servicio']}
function r6States(){return ['Pendiente','En proceso','Cancelada','Completada']}
function r6Priorities(){return ['Baja','Normal','Alta','Urgente']}
function r6FieldOptions(field){
 if(field==='state')return r6States().map(x=>[x,x]);
 if(field==='owner')return db.users.filter(u=>u.active).map(u=>[u.id,u.name]);
 if(field==='priority')return r6Priorities().map(x=>[x,x]);
 if(field==='type')return r6TaskTypes().map(x=>[x,x]);

 if(field==='branch')return [...new Set(db.users.map(u=>u.branch||'Arequipa'))].map(x=>[x,x]);
 return null;
}
function r6FilterLabel(field){return ({state:'Estado',owner:'Persona asignada',priority:'Prioridad',tags:'Etiquetas',end:'Fecha límite',type:'Tipo de tarea',branch:'Sede',list:'Lista',title:'Nombre'})[field]||field}
function r6FilterValue(i,f){const opts=r6FieldOptions(f.field);if(opts)return `<select onchange="r6SetFilter(${i},'value',this.value)"><option value="">Seleccionar</option>${opts.map(([v,n])=>`<option value="${esc(v)}" ${String(f.value)===String(v)?'selected':''}>${esc(n)}</option>`).join('')}</select>`;return `<input type="${f.field==='end'?'date':'text'}" value="${esc(f.value||'')}" placeholder="Escribir valor" oninput="r6SetFilter(${i},'value',this.value,false)">`}
function r6FilterPanel(){if(!r6FilterOpen)return '';return `<div class="r6-filterbox"><div class="row spread"><b>Filtros anidados</b><span class="sub">Cada condición puede combinarse con Y / O</span></div>${r6Filters.map((f,i)=>`<div class="r6-filterrow"><select onchange="r6SetFilter(${i},'join',this.value)"><option value="AND">${i?'Y':'Donde'}</option><option value="OR" ${f.join==='OR'?'selected':''}>${i?'O':'Donde'}</option></select><select onchange="r6SetFilter(${i},'field',this.value)">${['state','owner','priority','tags','end','type','branch','list','title'].map(x=>`<option value="${x}" ${f.field===x?'selected':''}>${r6FilterLabel(x)}</option>`).join('')}</select><select onchange="r6SetFilter(${i},'op',this.value)">${[['is','Es'],['not','No es'],['contains','Contiene'],['notcontains','No contiene']].map(([v,n])=>`<option value="${v}" ${f.op===v?'selected':''}>${n}</option>`).join('')}</select>${r6FilterValue(i,f)}<button title="Quitar" onclick="r6Filters.splice(${i},1);render()">×</button></div>`).join('')}<div class="row spread">${button('+ Añadir filtro','r6AddFilter()')} ${button('Borrar todo','r6Filters=[];render()')}</div></div>`}
function r6AddFilter(){r6Filters.push({join:r6Filters.length?'AND':'AND',field:'state',op:'is',value:''});render()}
function r6SetFilter(i,key,value,rerender=true){const f=r6Filters[i];if(!f)return;f[key]=value;if(key==='field')f.value='';if(rerender)render();else{clearTimeout(window.r6FilterTimer);window.r6FilterTimer=setTimeout(render,180)}}
function r6MatchOne(t,f){if(!f.value)return true;let value=f.field==='list'?taskList(t):t[f.field];value=String(value??'').toLowerCase();const wanted=String(f.value).toLowerCase();if(f.op==='is')return value===wanted;if(f.op==='not')return value!==wanted;if(f.op==='notcontains')return !value.includes(wanted);return value.includes(wanted)}
function r6TaskMatches(t){if(t.deleted)return false;if(!r6Filters.length)return true;let result=r6MatchOne(t,r6Filters[0]);for(let i=1;i<r6Filters.length;i++)result=r6Filters[i].join==='OR'?(result||r6MatchOne(t,r6Filters[i])):(result&&r6MatchOne(t,r6Filters[i]));return result}
filteredTasks=function(){return db.tasks.filter(t=>(!listFilter||taskList(t)===listFilter)&&r6TaskMatches(t))};

function r6SavedViews(){let mine=db.savedTaskViews.filter(v=>v.user===actor);if(!mine.length){const label=(actorUser()?.name||'Usuario').split(' ')[0]+' General';db.savedTaskViews.push({id:uid(),user:actor,name:label,taskView:'Lista',list:'',group:'',filters:[]});mine=db.savedTaskViews.filter(v=>v.user===actor)}return mine}
function r6ViewBar(){return `<div class="r6-viewbar">${r6SavedViews().map(v=>`<button onclick="r6ApplyView('${v.id}')">▦ ${esc(v.name)}</button>`).join('')}<button onclick="r6SaveView()">＋ Guardar vista</button></div>`}
function r6SaveView(){form('Guardar vista personal',field('name','Nombre de la vista',(actorUser()?.name||'Usuario').split(' ')[0]+' General','text','required'),d=>{db.savedTaskViews.push({id:uid(),user:actor,name:d.name,taskView,list:listFilter,group:r6GroupBy,filters:structuredClone(r6Filters)});save('Vista personal guardada',d.name)})}
function r6ApplyView(id){const v=db.savedTaskViews.find(v=>v.id===id);if(!v)return;taskView=v.taskView;listFilter=v.list;r6GroupBy=v.group;r6Filters=structuredClone(v.filters||[]);render()}
function r6Toolbar(){return `${r6ViewBar()}<div class="r6-toolbar">${button(`☰ ${r6Filters.length} filtros`,'r6FilterOpen=!r6FilterOpen;render()')}<label>Agrupar por<select onchange="r6GroupBy=this.value;render()"><option value="">Sin agrupar</option>${[['state','Estado'],['list','Lista'],['priority','Prioridad'],['owner','Persona asignada'],['type','Tipo']].map(([v,n])=>`<option value="${v}" ${r6GroupBy===v?'selected':''}>${n}</option>`).join('')}</select></label><span class="spacer"></span>${button('+ Tarea',"r6NewTask(null,'Tarea')",true)}</div>${r6FilterPanel()}`}
function r6BulkBar(){return r6Selected.size?`<div class="r6-bulk"><b>${r6Selected.size} seleccionadas</b>${button('Reasignar','r6BulkAssign()')}${button('Cambiar estado','r6BulkState()')}${button('Eliminar','r6BulkDelete()')} ${button('Cancelar selección','r6Selected.clear();render()')}</div>`:''}
function r6ToggleSelect(id,checked){checked?r6Selected.add(id):r6Selected.delete(id);render()}

function r6BulkAssign(){form('Reasignar tareas',select('owner','Nueva persona',db.users.filter(u=>u.active).map(u=>[u.id,u.name])),d=>{db.tasks.filter(t=>r6Selected.has(t.id)).forEach(t=>t.owner=d.owner);r6Selected.clear();save('Reasignación masiva',d.owner)})}
function r6BulkState(){form('Cambiar estado masivo',select('state','Estado',r6States().map(x=>[x,x])),d=>{db.tasks.filter(t=>r6Selected.has(t.id)).forEach(t=>{t.state=d.state;if(d.state==='Completada')createNextRecurring(t)});r6Selected.clear();save('Estado masivo',d.state)})}
function r6BulkDelete(){if(!confirm('Las tareas seleccionadas quedarán inactivas y podrán conservarse en auditoría.'))return;db.tasks.filter(t=>r6Selected.has(t.id)).forEach(t=>t.deleted=true);r6Selected.clear();save('Baja masiva de tareas','Baja recuperable')}

function r6Inline(id,field,value){const t=db.tasks.find(t=>t.id===id);if(!t)return;t[field]=value;if(field==='end')t.due=value;if(field==='state'&&value==='Completada')createNextRecurring(t);save('Edición en tabla',id+' '+field)}
function r6GridHeader(){return `<div class="r6-gridrow r6-gridhead"><div><input type="checkbox" onchange="r6ToggleAll(this.checked)"></div><div>Estado</div><div>Tarea</div><div>Inicio</div><div>Límite</div><div>Asignada</div><div>Prioridad</div><div>Creada por</div><div>Lista</div><div>Comentarios</div></div>`}
function r6GridRow(t,depth=0){const comments=db.taskComments.filter(c=>c.task===t.id).length,creator=t.createdBy==='Sistema'?'Sistema':tech(t.createdBy)||t.createdBy||'Sistema';return `<div class="r6-gridrow"><div><input type="checkbox" ${r6Selected.has(t.id)?'checked':''} onchange="r6ToggleSelect('${t.id}',this.checked)"></div><div>${taskStateButton(t)}</div><div class="r6-titlecell"><span class="r6-indent">${depth?'↳':''}</span><span class="r6-typebadge ${t.type==='Orden de servicio'?'r6-odsbadge':''}">${esc(t.type)}</span><input value="${esc(t.title)}" onchange="r6Inline('${t.id}','title',this.value)" onclick="event.stopPropagation()"><span class="r6-quick"><button title="Añadir subtarea" onclick="event.stopPropagation();r6NewTask('${t.id}','Tarea')">＋</button><button title="Abrir detalle" onclick="event.stopPropagation();openTaskPanel('${t.id}')">↗</button></span></div><div><input type="date" value="${esc(t.start||today())}" onchange="r6Inline('${t.id}','start',this.value)"></div><div><input type="date" value="${esc(t.end||t.due||today())}" onchange="r6Inline('${t.id}','end',this.value)"></div><div><select onchange="r6Inline('${t.id}','owner',this.value)">${db.users.filter(u=>u.active).map(u=>`<option value="${u.id}" ${u.id===t.owner?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div><select onchange="r6Inline('${t.id}','priority',this.value)">${r6Priorities().map(x=>`<option ${x===t.priority?'selected':''}>${x}</option>`).join('')}</select></div><div>${esc(creator)}</div><div><select onchange="r6Inline('${t.id}','list',this.value)">${db.lists.map(l=>`<option value="${l.id}" ${l.id===taskList(t)?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div><button onclick="openTaskPanel('${t.id}','activity')">💬 ${comments}</button></div></div>`}
function r6FlatRows(tasks){const byParent=new Map();tasks.forEach(t=>{const p=t.parent||'';if(!byParent.has(p))byParent.set(p,[]);byParent.get(p).push(t)});const walk=(p,d)=>((byParent.get(p)||[]).flatMap(t=>[r6GridRow(t,d),...walk(t.id,d+1)]));return walk('',0).join('')}
function r6GroupKey(t){if(!r6GroupBy)return '';if(r6GroupBy==='list')return db.lists.find(l=>l.id===taskList(t))?.name||'Sin lista';if(r6GroupBy==='owner')return tech(t.owner)||'Sin asignar';return t[r6GroupBy]||'Sin dato'}
function taskListR6(ts){if(!r6GroupBy)return `<div class="r6-sheet"><div class="r6-grid">${r6GridHeader()}${r6FlatRows(ts)}</div></div>`;const groups=Object.groupBy(ts,r6GroupKey);return `<div class="r6-sheet"><div class="r6-grid">${Object.entries(groups).map(([k,v])=>`<div class="r6-group">${esc(k)} <small>${v.length} tareas</small></div>${r6GridHeader()}${r6FlatRows(v)}`).join('')}</div></div>`}
function taskContentR6(){const ts=filteredTasks();if(taskView==='Lista')return taskListR6(ts);if(taskView==='Tablero')return taskBoardR5(ts);if(taskView==='Calendario')return taskCalendarR5(ts);return agendaGrid()}

function r6CommentHtml(c){const author=tech(c.actor)||c.actor,att=c.attachment?c.attachment.type.startsWith('image/')?`<img src="${c.attachment.data}" alt="${esc(c.attachment.name)}">`:`<audio controls src="${c.attachment.data}"></audio>`:'';return `<article class="r6-comment ${c.replyTo?'reply':''}"><header><b>${esc(author)}</b><small>${esc(c.date)}</small></header>${c.replyTo?`<small>Respuesta a ${esc(db.taskComments.find(x=>x.id===c.replyTo)?.text||'comentario')}</small>`:''}<p>${esc(c.text)}</p>${att}<footer><button onclick="r6React('${c.id}','👍')">👍 ${(c.reactions?.['👍']||[]).length}</button><button onclick="r6React('${c.id}','😊')">😊 ${(c.reactions?.['😊']||[]).length}</button><button onclick="r6ReplyTo='${c.id}';render()">Responder</button></footer></article>`}

function r6PostComment(id,formEl){const text=formEl.elements.message.value.trim(),file=formEl.elements.attachment.files[0],add=attachment=>{db.taskComments.push({id:uid(),task:id,actor,text,date:new Date().toISOString(),replyTo:r6ReplyTo,reactions:{},attachment});r6ReplyTo=null;save('Comentario de tarea',id)};if(!file)return add(null);if(file.size>700000||!(/^(image\/(jpeg|png|webp)|audio\/)/.test(file.type)))return toast('Solo imagen o audio de hasta 700 KB.');const reader=new FileReader();reader.onload=()=>add({name:file.name,type:file.type,data:reader.result});reader.readAsDataURL(file)}

    const o=db.orders.find(x=>x.id===d.order);let target;
    if(d.target==='__create__'){target={id:uid(),name:line.description,type:'producto',qty:line.qty,price:0,cost:line.cost,logisticTag:'Comprado'};o.lines.push(target);if(o.approval==='Aprobada')o.approval='Pendiente';r7Log(o.id,'Producto creado desde compra','Se creó '+line.description+' desde el comprobante '+inv.code+'. La decisión requiere revisión por ser un ítem nuevo.')}

function r7ReopenDay(){
  if(actorUser()?.role!=='Administrador')return toast('Solo el administrador puede reabrir un día.');
  const old=db.dayReviews.find(x=>x.date===selectedDate);form('Reabrir jornada · '+selectedDate,field('reason','Motivo de reapertura','','textarea','required'),d=>{db.dayReviews=db.dayReviews.filter(x=>x.date!==selectedDate);db.audit.push({date:new Date().toISOString(),actor,action:'Jornada reabierta',detail:selectedDate+' · '+d.reason+' · cierre previo: '+(old?.note||'')});save('Jornada reabierta',selectedDate)})
}
dayReviewPanel=function(){
  const r=db.dayReviews.find(x=>x.date===selectedDate),role=actorUser()?.role;
  return '<div class="panel space '+(r?'r7-locked':'')+'"><div class="row spread"><div><h3>Cierre diario por sede y fecha</h3><p>'+(r?'Cerrado por '+esc(tech(r.actor))+' · '+esc(r.note):'La jornada todavía es editable.')+'</p></div>'+(r?'<span class="pill green">Bloqueada</span>':'<span class="pill orange">Abierta</span>')+'</div><div class="row">'+(!r&&['Jefe de taller','Administrador'].includes(role)?button('Cerrar jornada','r7CloseDay()',true):'')+(r&&role==='Administrador'?button('Reabrir con motivo','r7ReopenDay()'):'')+'</div><p class="sub">No es control de asistencia. El cierre consolida segmentos y bloquea ediciones; toda reapertura queda auditada.</p></div>'
};
approveDay=r7CloseDay;
function r7SplitBlock(id){
  const b=db.blocks.find(x=>x.id===id);if(db.dayReviews.some(x=>x.date===b.date))return toast('La jornada está cerrada.');
  form('Dividir o postergar actividad',field('advanced','Tiempo ya avanzado',0,'number','min="0" max="'+b.hours+'" step="0.25" required')+field('date','Fecha de continuación',b.date,'date','required')+field('time','Hora de continuación',timeText(b.start),'time','required step="900"')+field('reason','Motivo opcional','','text'),d=>{const advanced=+d.advanced,remaining=+(b.hours-advanced).toFixed(2),start=minutes(d.time);if(!remaining)throw Error('No queda tiempo por continuar.');if(!validSlot(b.tech,d.date,start,remaining,id))throw Error('La continuación no cabe en ese horario.');const before=b.hours;if(advanced===0){b.date=d.date;b.start=start}else{b.hours=advanced;db.blocks.push({...structuredClone(b),id:uid(),date:d.date,start,hours:remaining,continuedFrom:b.id})}db.audit.push({date:new Date().toISOString(),actor,action:'Actividad dividida/postergada',detail:b.name+' · '+before+' H-H → '+advanced+' + '+remaining+' · '+(d.reason||'Sin motivo')});save('Actividad dividida',b.name)})
}
blockDetail=function(id){
  const b=db.blocks.find(x=>x.id===id),o=db.orders.find(x=>x.id===b.order),closed=db.dayReviews.some(x=>x.date===b.date);
  modal('<div class="row spread"><div><span class="pill">'+(closed?'Jornada cerrada':'Editable cada 15 min')+'</span><h2>'+esc(b.name)+'</h2></div><b>'+esc(timeText(b.start))+'–'+esc(timeText(blockEnd(b)))+'</b></div><p>'+esc(tech(b.tech))+' · '+b.hours+' H-H · '+esc(b.note||'Sin observación')+'</p><div class="r7-scope">La hora de llegada de la ODS no cambia cuando se mueve este segmento. El esfuerzo real se consolida sumando sus segmentos.</div><footer>'+(!closed?button('Editar horario',"editScheduledBlock('"+id+"')")+button('Dividir / postergar',"r7SplitBlock('"+id+"')",true):'')+(o?button('Abrir tarea ODS',"closeModal();openOrder('"+o.id+"')"):'')+button('Cerrar','closeModal()')+'</footer>')
};
editScheduledBlock=function(id){const b=db.blocks.find(x=>x.id===id);form('Editar horario en intervalos de 15 min',field('time','Inicio',timeText(b.start),'time','required step="900"')+field('hours','H-H',b.hours,'number','required min="0.25" step="0.25"')+field('reason','Motivo opcional','','text'),d=>commitBlockChange(id,minutes(d.time),+d.hours,d.reason||''))}
newQuickWork=function(techId=actor,start){
  if(!['Técnico','Jefe de taller','Administrador'].includes(actorUser()?.role))return toast('Solo personal operativo agrega servicios express.');
  const target=techId||actor;form('Servicio express / trabajo del día',select('vehicle','Vehículo',db.vehicles.map(v=>[v.id,v.plate+' · '+v.model]))+field('service','Servicio o diagnóstico','','text','required')+field('date','Fecha',selectedDate,'date','required')+field('time','Inicio',timeText(start||scheduleFor(selectedDate).start*60),'time','required step="900"')+field('hours','H-H',0.5,'number','min="0.25" step="0.25" required')+field('note','Nota breve','','text'),d=>{const st=minutes(d.time);if(!validSlot(target,d.date,st,+d.hours))throw Error('Horario sin capacidad.');const b={id:uid(),express:true,vehicle:d.vehicle,tech:target,date:d.date,start:st,hours:+d.hours,name:d.service,note:d.note};db.blocks.push(b);const cashier=db.users.find(u=>u.active&&u.role==='Cajera')?.id||db.users.find(u=>u.role==='Administrador')?.id;db.tasks.push({id:uid(),list:'atencion',type:'Adicional',title:'Validar servicio express: '+d.service,owner:cashier,createdBy:actor,createdAt:new Date().toISOString(),start:today(),end:today(),due:today(),startTime:d.time,endTime:d.time,state:'Pendiente',priority:'Alta',tags:'Express',notes:['Confirmar con técnico y crear ODS; sin ODS no cuenta como productividad.'],expressBlock:b.id});save('Servicio express creado',b.id)})
};
r7Ensure();
db.settings??={};document.body.classList.add('r7-nohandles');
render();
</script></body></html>
